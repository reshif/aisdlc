# Local-prod stack (PLAN M8.0). One command from a clean checkout:
#
#   ./init-secrets && docker compose --profile fake-github up -d --wait
#
# Read README.md first: it says why each container is a container (RV §2: a key, a Docker or socket
# right, egress, AR9 independence, or an untrusted origin; everything else would be a module of core
# or a loop of core-worker), what local-prod stubs against the cloud target, and how to point the
# stack at a real GitHub App.
#
# Ports: every service has its own (postgres 5432, kms-local 8300, notary 8310, witness 8320,
# identity 8330, bff 8340, codehost 8350, core-worker 8360, knowledge 8370, core 8380, dev-oidc 8390,
# killswitch 8400, gateway 8410, package mirror 8420, sandbox-controller 8430, verify 8440, fake GitHub 8353 api / 8354 git). Only the bff and dev-oidc are published, on 127.0.0.1.

x-factory:
  &factory # The one image, built by `migrate` below; every service picks its bundle with `command`.
  image: aisdlc/factory:local
  pull_policy: never
  user: '${AISDLC_UID:?run ./init-secrets first}:${AISDLC_GID:?run ./init-secrets first}'
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:mode=1777,size=64m
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: '3' }

# Networks. Docker has no packet filter between containers of one network, so a network is the unit
# of "can reach": two services that share one can call each other (and then only a token and its
# scopes stand between them). The networks below are cut so that the paths the specs forbid do not
# exist at all, and the ones that must exist are as narrow as the topology allows.
networks:
  # Browser edge: the only network with published ports (bff, dev-oidc). Not internal, because a
  # published port needs a route in; neither service needs one out.
  edge: {}
  # The services that call each other: core, core-worker, identity, knowledge, codehost (and seed).
  app:
    internal: true
  # Postgres reached by each database's own clients and nobody else. The Notary's and the Witness's
  # databases are on networks the record services never join (their roles also cannot connect to
  # each other's database, see db-init.sh).
  data-record:
    internal: true
  data-notary:
    internal: true
  data-witness:
    internal: true
  # The kill switch's own database network (AR9): nothing but the kill switch and Postgres is on it.
  data-killswitch:
    internal: true
  # kms-local reached by its callers. Three networks so that the Notary and the Witness, the two
  # independent signers (AR9, C33), have no route to each other or to the other callers through it.
  kms-notary:
    internal: true
  kms-witness:
    internal: true
  kms-clients:
    internal: true
  # The kill switch's own signer link: it has its own key (`dev:killswitch`) and no other caller of
  # kms-local can see it from here.
  kms-killswitch:
    internal: true
  # The Notary's API: its callers (core, core-worker, identity, seed). Knowledge, codehost, the bff
  # and the dev IdP are not on it. The Witness's API: its caller (core-worker, for the checkpointer).
  notary-api:
    internal: true
  witness-api:
    internal: true
  # The kill switch's API (AR9): its readers and pushers (core-worker) and the operator path. Core, the
  # Notary, the codehost, the bff and every other service are not on it, and the kill switch is on no
  # network of theirs: it has no route to core's write or command APIs, or to anything else. The one
  # core-side member is core-worker, whose HTTP surface is /healthz, /metrics and /admission (nothing
  # writes); the kill switch has no client that calls it.
  killswitch-api:
    internal: true
  # The model gateway (RV §2 "Model key custody"): the one container that holds a vendor key. Three
  # networks and no more. `gateway-api` is its HTTP surface (the admin API for the work engine, the
  # Messages endpoint for sandboxes: later milestones attach their callers here and to no other
  # network of the gateway). `killswitch-gateway` is the one link it needs into the trust plane: the
  # kill switch's read API, asked before every call (nothing else of the kill switch's is reachable
  # from there, and the gateway is on no kms, notary or witness network). `gateway-egress` is its own
  # way out (the model vendor's API) and nobody else is on it.
  gateway-api:
    internal: true
  # The gateway's own way to Postgres. It shares the record database (the aisdlc role) but NOT the
  # data-record network, so it has no route to identity, core, the bff or the rest of the record
  # services that sit there: only Postgres is on it besides the gateway.
  data-gateway:
    internal: true
  killswitch-gateway:
    internal: true
  gateway-egress: {}
  # The sandbox plane (profile `sandbox`, PLAN M13.2). None of these has a route out.
  #   - `sandbox-mirror`: the package mirror's own network. Each sandbox session gets a per-session internal
  #     network (created and removed by the sandbox driver through the coding proxy) and the mirror and the
  #     gateway are attached to it under fixed aliases: those two are the only peers a session ever has.
  #   - `docker-cvw` and `docker-coding`: the way each client reaches ITS Docker socket proxy and nothing else.
  sandbox-mirror:
    internal: true
  docker-cvw:
    internal: true
  docker-coding:
    internal: true
  # The sandbox-controller (M14.2, ADR-0003 §6-7): `sandbox-controller-api` is how core-worker asks it for a session and
  # for the free slots H2 reads (nobody else is on it); `data-sandbox-controller` is its own way to Postgres (its
  # least-privilege role reads the published caps and the admission grant, nothing else), shared with Postgres only.
  sandbox-controller-api:
    internal: true
  data-sandbox-controller:
    internal: true
  # The verify service (M14.3, the plan's `cvw`): `verify-api` is how core-worker asks it for a step's check (nobody
  # else is on it); `data-verify` is its own way to Postgres (its role writes its own table and its own `verify:`
  # record streams, nothing else); `verify-codehost` is its one link to the codehost (the bundle route: the repo at the
  # base commit and the Unit head). Its kits reach the sandbox-controller on `sandbox-controller-api`, its reviewer the
  # gateway on `gateway-api` (under the run's own key).
  verify-api:
    internal: true
  data-verify:
    internal: true
  verify-codehost:
    internal: true
  # The object store's API (M14.1). core-worker is its one caller (M14.4: 7.6 stores the signed Evidence Packs in the
  # write-once bucket); the store has no other network and no route out.
  objectstore-api:
    internal: true
  # The codehost's only way out: api.github.com and github.com. Knowledge is not on it (nor on any
  # network with a route out), so it has no route to GitHub and gets repo content only as bundles
  # from the codehost.
  egress: {}

volumes:
  pgdata: {}
  kms-state: {}
  codehost-work: {}
  knowledge-work: {}
  objectstore-data: {}

secrets:
  pg-superuser: { file: ./secrets/pg-superuser }
  pg-pass-aisdlc: { file: ./secrets/pg-pass-aisdlc }
  pg-pass-notary: { file: ./secrets/pg-pass-notary }
  pg-pass-witness: { file: ./secrets/pg-pass-witness }
  pg-pass-killswitch: { file: ./secrets/pg-pass-killswitch }
  pg-pass-gateway: { file: ./secrets/pg-pass-gateway }
  pg-pass-sandbox-controller: { file: ./secrets/pg-pass-sandbox-controller }
  db-url-aisdlc: { file: ./secrets/db-url-aisdlc }
  db-url-notary: { file: ./secrets/db-url-notary }
  db-url-witness: { file: ./secrets/db-url-witness }
  db-url-killswitch: { file: ./secrets/db-url-killswitch }
  db-url-gateway: { file: ./secrets/db-url-gateway }
  db-url-sandbox-controller: { file: ./secrets/db-url-sandbox-controller }
  pg-pass-verify: { file: ./secrets/pg-pass-verify }
  db-url-verify: { file: ./secrets/db-url-verify }
  bff-oidc-client-secret: { file: ./secrets/bff-oidc-client-secret }
  anthropic-api-key: { file: ./secrets/anthropic-api-key }
  github-app.pem: { file: ./secrets/github-app.pem }
  github-app.pub.pem: { file: ./secrets/github-app.pub.pem }
  tok-notary-kms: { file: ./secrets/tok-notary-kms }
  tok-witness-kms: { file: ./secrets/tok-witness-kms }
  tok-killswitch-kms: { file: ./secrets/tok-killswitch-kms }
  tok-core-worker-killswitch: { file: ./secrets/tok-core-worker-killswitch }
  tok-operator-killswitch: { file: ./secrets/tok-operator-killswitch }
  tok-gateway-killswitch: { file: ./secrets/tok-gateway-killswitch }
  tok-core-gateway: { file: ./secrets/tok-core-gateway }
  tok-core-worker-gateway: { file: ./secrets/tok-core-worker-gateway }
  tok-operator-gateway: { file: ./secrets/tok-operator-gateway }
  tok-operator-codehost: { file: ./secrets/tok-operator-codehost }
  tok-knowledge-kms: { file: ./secrets/tok-knowledge-kms }
  tok-bff-kms: { file: ./secrets/tok-bff-kms }
  tok-bff-core: { file: ./secrets/tok-bff-core }
  tok-core-kms: { file: ./secrets/tok-core-kms }
  tok-core-worker-kms: { file: ./secrets/tok-core-worker-kms }
  tok-identity-kms: { file: ./secrets/tok-identity-kms }
  tok-core-notary: { file: ./secrets/tok-core-notary }
  tok-core-worker-notary: { file: ./secrets/tok-core-worker-notary }
  tok-identity-notary: { file: ./secrets/tok-identity-notary }
  tok-core-worker-witness: { file: ./secrets/tok-core-worker-witness }
  tok-core-worker-identity: { file: ./secrets/tok-core-worker-identity }
  tok-codehost-identity: { file: ./secrets/tok-codehost-identity }
  tok-knowledge-identity: { file: ./secrets/tok-knowledge-identity }
  tok-seed-identity: { file: ./secrets/tok-seed-identity }
  tok-codehost-core: { file: ./secrets/tok-codehost-core }
  tok-identity-core: { file: ./secrets/tok-identity-core }
  tok-operator-core: { file: ./secrets/tok-operator-core }
  tok-core-knowledge: { file: ./secrets/tok-core-knowledge }
  tok-core-worker-knowledge: { file: ./secrets/tok-core-worker-knowledge }
  tok-knowledge-codehost: { file: ./secrets/tok-knowledge-codehost }
  tok-core-codehost: { file: ./secrets/tok-core-codehost }
  tok-core-worker-codehost: { file: ./secrets/tok-core-worker-codehost }
  tok-sandbox-controller-docker-coding: { file: ./secrets/tok-sandbox-controller-docker-coding }
  tok-core-worker-sandbox-controller: { file: ./secrets/tok-core-worker-sandbox-controller }
  tok-operator-sandbox-controller: { file: ./secrets/tok-operator-sandbox-controller }
  tok-core-worker-verify: { file: ./secrets/tok-core-worker-verify }
  tok-verify-codehost: { file: ./secrets/tok-verify-codehost }
  tok-verify-sandbox-controller: { file: ./secrets/tok-verify-sandbox-controller }
  tok-smoke-docker-coding: { file: ./secrets/tok-smoke-docker-coding }
  tok-cvw-docker-cvw: { file: ./secrets/tok-cvw-docker-cvw }
  object-store-access-key: { file: ./secrets/object-store-access-key }
  object-store-secret-key: { file: ./secrets/object-store-secret-key }

services:
  # ------------------------------------------------------------------------------------ data

  # Boundary: record vs execution databases (AR1, C47) and a database per key holder. One server
  # here, three databases and three roles (cloud: separate clusters).
  postgres:
    image: postgres:16.4@sha256:e62fbf9d3e2b49816a32c400ed2dba83e3b361e6833e624024309c35d334b412
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/pg-superuser
    command: ['postgres', '-c', 'max_connections=100', '-c', 'shared_buffers=64MB']
    volumes:
      - pgdata:/var/lib/postgresql/data
    secrets: [pg-superuser]
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      [
        data-record,
        data-notary,
        data-witness,
        data-killswitch,
        data-gateway,
        data-sandbox-controller,
        data-verify,
      ]
    mem_limit: 512m
    shm_size: 64m

  # The init step: roles and databases (record, notary, witness, killswitch), idempotent.
  db-init:
    image: postgres:16.4@sha256:e62fbf9d3e2b49816a32c400ed2dba83e3b361e6833e624024309c35d334b412
    user: '${AISDLC_UID:?run ./init-secrets first}:${AISDLC_GID:?run ./init-secrets first}'
    restart: 'no'
    read_only: true
    tmpfs: ['/tmp:mode=1777,size=16m']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    entrypoint: ['sh', '/db-init.sh']
    environment:
      PGHOST: postgres
    volumes:
      - ./db-init.sh:/db-init.sh:ro
    secrets:
      [
        pg-superuser,
        pg-pass-aisdlc,
        pg-pass-notary,
        pg-pass-witness,
        pg-pass-killswitch,
        pg-pass-gateway,
        pg-pass-sandbox-controller,
        pg-pass-verify,
      ]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [data-record, data-notary, data-witness, data-killswitch]
    mem_limit: 64m

  # `aisdlc-migrate` first: every schema in dependency order, the Notary's, the Witness's and the kill
  # switch's databases too (--notary --witness --killswitch). This service also builds the image (see Dockerfile).
  migrate:
    <<: *factory
    build:
      context: ../..
      dockerfile: platform/compose/Dockerfile
      # Unset: the Dockerfile's pinned images. Set RUNTIME_IMAGE to a base that already has git.
      args: [RUNTIME_IMAGE]
    restart: 'no'
    command:
      [
        'node',
        '/app/packages/migrate/dist/aisdlc-migrate.js',
        '--notary',
        '--witness',
        '--killswitch',
      ]
    environment:
      AISDLC_DATABASE_URL: file:/run/secrets/db-url-aisdlc
      AISDLC_NOTARY_DATABASE_URL: file:/run/secrets/db-url-notary
      AISDLC_WITNESS_DATABASE_URL: file:/run/secrets/db-url-witness
      AISDLC_KILLSWITCH_DATABASE_URL: file:/run/secrets/db-url-killswitch
    secrets: [db-url-aisdlc, db-url-notary, db-url-witness, db-url-killswitch]
    depends_on:
      db-init: { condition: service_completed_successfully }
    networks: [data-record, data-notary, data-witness, data-killswitch]
    mem_limit: 192m

  # ---------------------------------------------------------------------------- trust plane

  # Boundary: key custody. The only holder of the Notary, Witness, kill switch, step-up and fingerprint keys;
  # signs digests and MACs by key id and never hands a key out. dev: keys, so it refuses to start
  # unless FACTORY_ENV=local (cloud: AWS KMS, Notary and Witness in separate accounts).
  kms-local:
    <<: *factory
    command: ['node', '--enable-source-maps', '/app/services/kms-local/dist/main.js']
    environment:
      FACTORY_ENV: local
      KMS_DIR: /kms
      KMS_HOST: 0.0.0.0
      KMS_PORT: '8300'
      # Callers that may use a key (RV §2 allow-list) and callers that only read public keys (keys: []).
      KMS_CALLERS: >-
        {"notary":{"token_ref":"file:/run/secrets/tok-notary-kms"},
        "witness":{"token_ref":"file:/run/secrets/tok-witness-kms"},
        "knowledge":{"token_ref":"file:/run/secrets/tok-knowledge-kms"},
        "bff":{"token_ref":"file:/run/secrets/tok-bff-kms"},
        "killswitch":{"token_ref":"file:/run/secrets/tok-killswitch-kms"},
        "core":{"token_ref":"file:/run/secrets/tok-core-kms","keys":[]},
        "core-worker":{"token_ref":"file:/run/secrets/tok-core-worker-kms","keys":[]},
        "identity":{"token_ref":"file:/run/secrets/tok-identity-kms","keys":[]}}
    volumes:
      - kms-state:/kms
    secrets:
      [
        tok-notary-kms,
        tok-witness-kms,
        tok-knowledge-kms,
        tok-bff-kms,
        tok-killswitch-kms,
        tok-core-kms,
        tok-core-worker-kms,
        tok-identity-kms,
      ]
    healthcheck:
      test: ['CMD', 'node', '/app/healthcheck.mjs', '8300']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [kms-notary, kms-witness, kms-killswitch, kms-clients]
    mem_limit: 128m

  # Boundary: ledger signer (C08n "the only signer", AR1). Its own database and role.
  notary:
    <<: *factory
    command: ['node', '--enable-source-maps', '/app/services/notary/dist/main.js']
    environment:
      NOTARY_DATABASE_URL: file:/run/secrets/db-url-notary
      NOTARY_CALLERS: >-
        {"core":{"token_ref":"file:/run/secrets/tok-core-notary","scopes":["ledger","read"]},
        "core-worker":{"token_ref":"file:/run/secrets/tok-core-worker-notary","scopes":["ledger","read","checkpoint","evidence"]},
        "identity":{"token_ref":"file:/run/secrets/tok-identity-notary","scopes":["ledger","read"]}}
      KMS_URL: http://kms-local:8300
      KMS_TOKEN_REF: file:/run/secrets/tok-notary-kms
      NOTARY_HOST: 0.0.0.0
      NOTARY_PORT: '8310'
    secrets:
      [db-url-notary, tok-core-notary, tok-core-worker-notary, tok-identity-notary, tok-notary-kms]
    healthcheck:
      test: ['CMD', 'node', '/app/healthcheck.mjs', '8310']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    depends_on:
      migrate: { condition: service_completed_successfully }
      kms-local: { condition: service_healthy }
    networks: [kms-notary, notary-api, data-notary]
    mem_limit: 128m

  # Boundary: AR9 independence. The second signer of every checkpoint, with a database, a role and a
  # key of its own, and no route to the Notary. Its one caller is core-worker's checkpointer loop
  # (M8.0b), which mounts tok-core-worker-witness.
  witness:
    <<: *factory
    command: ['node', '--enable-source-maps', '/app/services/witness/dist/main.js']
    environment:
      WITNESS_DATABASE_URL: file:/run/secrets/db-url-witness
      WITNESS_CALLERS: >-
        {"core-worker":{"token_ref":"file:/run/secrets/tok-core-worker-witness"}}
      KMS_URL: http://kms-local:8300
      KMS_TOKEN_REF: file:/run/secrets/tok-witness-kms
      WITNESS_HOST: 0.0.0.0
      WITNESS_PORT: '8320'
    secrets: [db-url-witness, tok-core-worker-witness, tok-witness-kms]
    healthcheck:
      test: ['CMD', 'node', '/app/healthcheck.mjs', '8320']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    depends_on:
      migrate: { condition: service_completed_successfully }
      kms-local: { condition: service_healthy }
    networks: [kms-witness, witness-api, data-witness]
    mem_limit: 128m

  # Boundary: AR9 independence. The kill switch has its own database and role, its own key
  # (`dev:killswitch`, which no other caller of kms-local may use) and its own network. It depends on
  # nothing of core's or Temporal's and has no route to core's write or command APIs: it is on no
  # network of core's and holds no token of core's. Core-worker READS it (admission, the journal) and
  # PUSHES to it (who holds what); the operator token is for a person's kill when core is down.
  # Factory admins (the only people who may kill the fleet) are its own configuration.
  killswitch:
    <<: *factory
    command: ['node', '--enable-source-maps', '/app/services/killswitch/dist/main.js']
    environment:
      KILLSWITCH_DATABASE_URL: file:/run/secrets/db-url-killswitch
      KILLSWITCH_CALLERS: >-
        {"core-worker":{"token_ref":"file:/run/secrets/tok-core-worker-killswitch","scopes":["read","sync"]},
        "operator":{"token_ref":"file:/run/secrets/tok-operator-killswitch","scopes":["act","read"]},
        "gateway":{"token_ref":"file:/run/secrets/tok-gateway-killswitch","scopes":["read"]}}
      KILLSWITCH_FACTORY_ADMINS: '["alice","bob"]'
      KMS_URL: http://kms-local:8300
      KMS_TOKEN_REF: file:/run/secrets/tok-killswitch-kms
      KILLSWITCH_HOST: 0.0.0.0
      KILLSWITCH_PORT: '8400'
    secrets:
      [
        db-url-killswitch,
        tok-core-worker-killswitch,
        tok-operator-killswitch,
        tok-gateway-killswitch,
        tok-killswitch-kms,
      ]
    healthcheck:
      test: ['CMD', 'node', '/app/healthcheck.mjs', '8400']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    depends_on:
      migrate: { condition: service_completed_successfully }
      kms-local: { condition: service_healthy }
    networks: [kms-killswitch, killswitch-api, killswitch-gateway, data-killswitch]
    mem_limit: 128m

  # Boundary: model key custody (RV §2, AR5, AR7). EVERY model call of the factory goes through here and
  # this is the only container that mounts a vendor key (`anthropic-api-key`, a file; no other service
  # can read it and it is in no environment, log, response or record event). It routes by (environment,
  # data class) from the published config (D3 has no route), meters every call as a record event, holds
  # the per-Unit virtual keys (hashed), budgets, redaction and the tool allow-list, and asks the kill
  # switch before every call. It shares the record database (it appends `gateway.*` events and reads
  # config) over a network of its own (`data-gateway`, shared with Postgres only) and has no route to
  # kms-local, the Notary, the Witness, core or any other record service: its networks are its own
  # API, the kill switch's read link, Postgres (a network of its own) and its egress. Egress is a whole network
  # here; the cloud target is a security group or proxy that allows api.anthropic.com only.
  # Local-prod routes D0-D2 to the deterministic fake provider (the seed publishes that table); a
  # gated config revision points a route at Claude. `core` mounts tok-core-gateway when the work
  # engine mints per-Unit keys (M11); the operator token is how a person (or smoke.sh) reaches it now.
  gateway:
    <<: *factory
    # A sandbox network peer (M13.2): the coding proxy attaches a container to a session network only if it
    # carries this label, and by name, so the name is fixed. Sandboxes of a class with a key reach it at
    # `gateway:8410` with their per-Unit virtual key and at nothing else.
    container_name: ${COMPOSE_PROJECT_NAME:-aisdlc}-gateway
    labels:
      aisdlc.sandbox.peer: gateway
    command: ['node', '--enable-source-maps', '/app/services/gateway/dist/main.js']
    environment:
      # The least-privilege role `gateway` (db-init.sh, the gateway migration), NOT the `aisdlc` owner.
      GATEWAY_DATABASE_URL: file:/run/secrets/db-url-gateway
      GATEWAY_ENVIRONMENT: local
      GATEWAY_CALLERS: >-
        {"core":{"token_ref":"file:/run/secrets/tok-core-gateway","scopes":["admin","read"]},
        "core-worker":{"token_ref":"file:/run/secrets/tok-core-worker-gateway","scopes":["admin","read"]},
        "operator":{"token_ref":"file:/run/secrets/tok-operator-gateway","scopes":["admin","read"]}}
      # What this deployment lets a registry row do. The providers themselves (adapter, base URL, key
      # reference, models) are rows of the integration registry, published through an M1 gate; a row naming
      # another key file or host is refused.
      GATEWAY_SECRET_REFS: '["file:/run/secrets/anthropic-api-key"]'
      GATEWAY_EGRESS_HOSTS: '["api.anthropic.com"]'
      GATEWAY_KILLSWITCH_URL: http://killswitch:8400
      GATEWAY_KILLSWITCH_TOKEN_REF: file:/run/secrets/tok-gateway-killswitch
      GATEWAY_MAX_PROVIDER_CALLS: ${GATEWAY_MAX_PROVIDER_CALLS:-1000}
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: '8410'
    secrets:
      [
        db-url-gateway,
        anthropic-api-key,
        tok-core-gateway,
        tok-core-worker-gateway,
        tok-operator-gateway,
        tok-gateway-killswitch,
      ]
    healthcheck:
      test: ['CMD', 'node', '/app/healthcheck.mjs', '8410']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 8s
    depends_on:
      migrate: { condition: service_completed_successfully }
      killswitch: { condition: service_healthy }
    networks: [data-gateway, gateway-api, killswitch-gateway, gateway-egress]
    mem_limit: 192m

  # ------------------------------------------------------------------- identity and the seed

  # Boundary: identity and PDP source (AR2): the policy source and its journal are not shared with
  # the systems they police. Policy evaluation itself is embedded in core and the bff.
  identity:
    <<: *factory
    command: ['node', '--enable-source-maps', '/app/services/identity/dist/main.js']
    environment:
      IDENTITY_DATABASE_URL: file:/run/secrets/db-url-aisdlc
      IDENTITY_CALLERS: >-
        {"core-worker":{"token_ref":"file:/run/secrets/tok-core-worker-identity","scopes":["reconcile"]},
        "codehost":{"token_ref":"file:/run/secrets/tok-codehost-identity","scopes":["read","codeowners"]},
        "knowledge":{"token_ref":"file:/run/secrets/tok-knowledge-identity","scopes":["read"]},
        "seed":{"token_ref":"file:/run/secrets/tok-seed-identity","scopes":["read","write","sync"]}}
      NOTARY_URL: http://notary:8310
      IDENTITY_NOTARY_TOKEN_REF: file:/run/secrets/tok-identity-notary
      KMS_URL: http://kms-local:8300
      KMS_TOKEN_REF: file:/run/secrets/tok-identity-kms
      IDENTITY_IDP_SEED_FILE: /config/idp-seed.json
      # Project settings live in core: read over its API (scope read), lazily, so identity starts first.
      IDENTITY_CORE_URL: http://core:8380
      IDENTITY_CORE_TOKEN_REF: file:/run/secrets/tok-identity-core
      IDENTITY_HOST: 0.0.0.0
      IDENTITY_PORT: '8330'
    volumes:
      - ./config/idp-seed.json:/config/idp-seed.json:ro
    secrets:
      [
        db-url-aisdlc,
        tok-core-worker-identity,
        tok-codehost-identity,
        tok-knowledge-identity,
        tok-seed-identity,
        tok-identity-notary,
        tok-identity-kms,
        tok-identity-core,
      ]
    healthcheck:
      test: ['CMD', 'node', '/app/healthcheck.mjs', '8330']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 8s
    depends_on:
      migrate: { condition: service_completed_successfully }
      notary: { condition: service_healthy }
      kms-local: { condition: service_healthy }
    networks: [app, data-record, kms-clients, notary-api]
    mem_limit: 192m

  # First-run bootstrap, LOCAL ONLY (refuses unless FACTORY_ENV=local): makes the factory admin a
  # `factory.admin` through identity's API and publishes the policy bundle through its M1 gate.
  # Without it every decision is a deny and nobody may onboard anything. It runs as core (core's
  # Notary and KMS tokens). Idempotent.
  seed:
    <<: *factory
    restart: 'no'
    command: ['node', '--enable-source-maps', '/app/services/core/dist/aisdlc-seed.js']
    environment:
      FACTORY_ENV: local
      CORE_DATABASE_URL: file:/run/secrets/db-url-aisdlc
      CORE_NOTARY_URL: http://notary:8310
      CORE_NOTARY_TOKEN_REF: file:/run/secrets/tok-core-notary
      KMS_URL: http://kms-local:8300
      KMS_TOKEN_REF: file:/run/secrets/tok-core-kms
      SEED_IDENTITY_URL: http://identity:8330
      SEED_IDENTITY_TOKEN_REF: file:/run/secrets/tok-seed-identity
      SEED_FACTORY_ADMIN: alice
      # The GitHub App is the first code-host row of the integration registry (ids and a key REFERENCE;
      # the key itself stays in the codehost's own file).
      SEED_GITHUB_APP_ID: ${GITHUB_APP_ID:?run ./init-secrets first}
      SEED_GITHUB_INSTALLATION_ID: ${GITHUB_INSTALLATION_ID:?run ./init-secrets first}
      SEED_GITHUB_APP_KEY_REF: file:/run/secrets/github-app.pem
      SEED_GITHUB_API_URL: ${CODEHOST_GITHUB_API_URL:-}
      SEED_GITHUB_GIT_URL: ${CODEHOST_GIT_URL:-}
    secrets: [db-url-aisdlc, tok-core-notary, tok-core-kms, tok-seed-identity]
    depends_on:
      migrate: { condition: service_completed_successfully }
      identity: { condition: service_healthy }
      notary: { condition: service_healthy }
    networks: [app, data-record, kms-clients, notary-api]
    mem_limit: 192m

  # ------------------------------------------------------------------------------- core

  # Projects, S0, cards, decisions: the record's writer. Verifies the bff's step-up proofs with the
  # public key from kms-local (it never signs). Cards need knowledge, the codehost reads and the
  # Notary together.
  core:
    <<: *factory
    command: ['node', '--enable-source-maps', '/app/services/core/dist/main.js']
    environment:
      CORE_DATABASE_URL: file:/run/secrets/db-url-aisdlc
      CORE_CALLERS: >-
        {"codehost":{"token_ref":"file:/run/secrets/tok-codehost-core","scopes":["registry","integrations"]},
        "identity":{"token_ref":"file:/run/secrets/tok-identity-core","scopes":["read"]},
        "operator":{"token_ref":"file:/run/secrets/tok-operator-core","scopes":["read","onboard","portal"]},
        "bff":{"token_ref":"file:/run/secrets/tok-bff-core","scopes":["read","onboard","portal","work"]}}
      CORE_NOTARY_URL: http://notary:8310
      CORE_NOTARY_TOKEN_REF: file:/run/secrets/tok-core-notary
      KMS_URL: http://kms-local:8300
      KMS_TOKEN_REF: file:/run/secrets/tok-core-kms
      CORE_KNOWLEDGE_URL: http://knowledge:8370
      CORE_KNOWLEDGE_TOKEN_REF: file:/run/secrets/tok-core-knowledge
      CORE_CODEHOST_URL: http://codehost:8350
      CORE_CODEHOST_TOKEN_REF: file:/run/secrets/tok-core-codehost
      CORE_HOST: 0.0.0.0
      CORE_PORT: '8380'
    secrets:
      [
        db-url-aisdlc,
        tok-codehost-core,
        tok-identity-core,
        tok-operator-core,
        tok-bff-core,
        tok-core-notary,
        tok-core-kms,
        tok-core-knowledge,
        tok-core-codehost,
      ]
    healthcheck:
      test: ['CMD', 'node', '/app/healthcheck.mjs', '8380']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 8s
    depends_on:
      migrate: { condition: service_completed_successfully }
      seed: { condition: service_completed_successfully }
      notary: { condition: service_healthy }
      kms-local: { condition: service_healthy }
    networks: [app, data-record, kms-clients, notary-api]
    mem_limit: 256m

  # The one process that hosts every loop (code-host polls, S0 driver, role-map sync, cards,
  # outbox watch). `/healthz` is 503 while any loop is down.
  core-worker:
    <<: *factory
    command: ['node', '--enable-source-maps', '/app/services/core-worker/dist/main.js']
    environment:
      CORE_WORKER_DATABASE_URL: file:/run/secrets/db-url-aisdlc
      CORE_WORKER_CODEHOST_URL: http://codehost:8350
      CORE_WORKER_CODEHOST_TOKEN_REF: file:/run/secrets/tok-core-worker-codehost
      CORE_WORKER_KNOWLEDGE_URL: http://knowledge:8370
      CORE_WORKER_KNOWLEDGE_TOKEN_REF: file:/run/secrets/tok-core-worker-knowledge
      CORE_WORKER_IDENTITY_URL: http://identity:8330
      CORE_WORKER_IDENTITY_TOKEN_REF: file:/run/secrets/tok-core-worker-identity
      CORE_WORKER_NOTARY_URL: http://notary:8310
      CORE_WORKER_NOTARY_TOKEN_REF: file:/run/secrets/tok-core-worker-notary
      # M8.0b: the checkpointer (Notary signs a tree head, the Witness co-signs it) and the reconciler.
      # 5 minutes by default; smoke.sh and e2e.sh set CHECKPOINT_INTERVAL_MS shorter.
      CORE_WORKER_WITNESS_URL: http://witness:8320
      CORE_WORKER_WITNESS_TOKEN_REF: file:/run/secrets/tok-core-worker-witness
      CORE_WORKER_CHECKPOINT_INTERVAL_MS: ${CHECKPOINT_INTERVAL_MS:-300000}
      # M9.6: the kill switch (AR9): admission reads it, the holders of every project are pushed to it,
      # its journal is recorded (and ledgered through the Notary). smoke.sh shortens the observer.
      CORE_WORKER_KILLSWITCH_URL: http://killswitch:8400
      CORE_WORKER_KILLSWITCH_TOKEN_REF: file:/run/secrets/tok-core-worker-killswitch
      CORE_WORKER_KILL_OBSERVER_INTERVAL_MS: ${KILL_OBSERVER_INTERVAL_MS:-5000}
      CORE_WORKER_KILL_HOLDERS_INTERVAL_MS: ${KILL_HOLDERS_INTERVAL_MS:-10000}
      # M12: the work driver with the real planning port (S1 to S5) and the model gateway, whose local fake
      # provider answers the planning steps with canned outputs (`fixtures: planning`). Off (`none`) unless the
      # run asks: e2e.sh sets `agents`; `fake` is the deterministic stage ports. The knowledge token above
      # carries the `search` scope (the KnowledgeSearch tool).
      CORE_WORKER_STAGE_PORTS: ${CORE_WORKER_STAGE_PORTS:-none}
      CORE_WORKER_GATEWAY_URL: http://gateway:8410
      CORE_WORKER_GATEWAY_TOKEN_REF: file:/run/secrets/tok-core-worker-gateway
      CORE_WORKER_AGENT_EXTRA_MODELS: fake-model
      # M14.2: S6's sessions through the sandbox-controller (profile `sandbox`; it holds the coding proxy's token, the
      # class ceilings and the caps; H2 reads its free slots). Off unless the run sets it, with CORE_WORKER_STAGE_PORTS=agents.
      CORE_WORKER_SANDBOX_CONTROLLER_URL: ${CORE_WORKER_SANDBOX_CONTROLLER_URL:-}
      CORE_WORKER_SANDBOX_CONTROLLER_TOKEN_REF: file:/run/secrets/tok-core-worker-sandbox-controller
      # M14.3: S7 7.1 to 7.5 through the verify service (profile `sandbox`), and the 7.6 guard. Off unless the run sets
      # it, with CORE_WORKER_STAGE_PORTS=agents.
      CORE_WORKER_VERIFY_URL: ${CORE_WORKER_VERIFY_URL:-}
      CORE_WORKER_VERIFY_TOKEN_REF: file:/run/secrets/tok-core-worker-verify
      # M14.4: 7.6 signs the Evidence Pack through the Notary (scope `evidence`) and stores it in the object store's
      # write-once bucket `evidence-packs` (with a D2's Handoff Pack beside it); the store's credentials are file
      # references the S3 adapter resolves. Used only when CORE_WORKER_VERIFY_URL is set.
      CORE_WORKER_OBJECT_STORE_URL: http://object-store:9000
      CORE_WORKER_OBJECT_STORE_ACCESS_KEY_REF: file:/run/secrets/object-store-access-key
      CORE_WORKER_OBJECT_STORE_SECRET_KEY_REF: file:/run/secrets/object-store-secret-key
      KMS_URL: http://kms-local:8300
      KMS_TOKEN_REF: file:/run/secrets/tok-core-worker-kms
      CORE_WORKER_HOST: 0.0.0.0
      CORE_WORKER_PORT: '8360'
    secrets:
      [
        db-url-aisdlc,
        tok-core-worker-codehost,
        tok-core-worker-knowledge,
        tok-core-worker-identity,
        tok-core-worker-notary,
        tok-core-worker-witness,
        tok-core-worker-killswitch,
        tok-core-worker-gateway,
        tok-core-worker-kms,
        tok-core-worker-sandbox-controller,
        tok-core-worker-verify,
        object-store-access-key,
        object-store-secret-key,
      ]
    healthcheck:
      test: ['CMD', 'node', '/app/healthcheck.mjs', '8360']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    depends_on:
      migrate: { condition: service_completed_successfully }
      core: { condition: service_healthy }
      codehost: { condition: service_healthy }
      knowledge: { condition: service_healthy }
      identity: { condition: service_healthy }
      witness: { condition: service_healthy }
      killswitch: { condition: service_healthy }
      gateway: { condition: service_healthy }
    networks:
      [
        app,
        data-record,
        kms-clients,
        notary-api,
        witness-api,
        killswitch-api,
        gateway-api,
        sandbox-controller-api,
        verify-api,
        objectstore-api,
      ]
    mem_limit: 256m

  # ------------------------------------------------------------------ code and repo content

  # Boundary: code-host credential custody (AR4, AR6, C24-CB). The only container with the GitHub
  # App key and the only one on the egress network. Reads only; hands knowledge credential-free
  # bundles. It has no database and no route to the trust plane.
  codehost:
    <<: *factory
    command: ['node', '--enable-source-maps', '/app/services/codehost/dist/main.js']
    environment:
      # The GitHub App is a row of the integration registry (`github-app`, seeded from the compose settings and
      # changed through an M1 gate), read from core and followed by config revision with no restart. The App
      # key stays in its own file (the reference is in the row); this deployment allows that one file and these
      # hosts (api.github.com and github.com; the fake profile adds its own loopback).
      CODEHOST_REGISTRY_INTEGRATION: github-app
      CODEHOST_SECRET_REFS: '["file:/run/secrets/github-app.pem"]'
      CODEHOST_EGRESS_HOSTS: '["api.github.com","github.com","127.0.0.1"]'
      CODEHOST_REGISTRY_INTERVAL_MS: ${CODEHOST_REGISTRY_INTERVAL_MS:-5000}
      CODEHOST_CALLERS: >-
        {"knowledge":{"token_ref":"file:/run/secrets/tok-knowledge-codehost","scopes":["census"]},
        "operator":{"token_ref":"file:/run/secrets/tok-operator-codehost","scopes":["reload"]},
        "core":{"token_ref":"file:/run/secrets/tok-core-codehost","scopes":["census","posture"]},
        "core-worker":{"token_ref":"file:/run/secrets/tok-core-worker-codehost","scopes":["census","posture"]},
        "verify":{"token_ref":"file:/run/secrets/tok-verify-codehost","scopes":["census"]}}
      CODEHOST_IDENTITY_URL: http://identity:8330
      CODEHOST_IDENTITY_TOKEN_REF: file:/run/secrets/tok-codehost-identity
      CODEHOST_CORE_URL: http://core:8380
      CODEHOST_CORE_TOKEN_REF: file:/run/secrets/tok-codehost-core
      TMPDIR: /work
      CODEHOST_HOST: 0.0.0.0
      CODEHOST_PORT: '8350'
    volumes:
      - codehost-work:/work
    secrets:
      [
        github-app.pem,
        tok-knowledge-codehost,
        tok-core-codehost,
        tok-core-worker-codehost,
        tok-operator-codehost,
        tok-codehost-identity,
        tok-codehost-core,
        tok-verify-codehost,
      ]
    healthcheck:
      test: ['CMD', 'node', '/app/healthcheck.mjs', '8350']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [app, egress, verify-codehost]
    mem_limit: 192m

  # Boundary: repo content (untrusted) vs credentials. Analyses bundles it gets from the codehost;
  # holds no code-host credential and no HMAC key (the fingerprint MAC is a call to kms-local); has
  # no route to GitHub. A secret scanner and census run here, not in core.
  knowledge:
    <<: *factory
    command: ['node', '--enable-source-maps', '/app/services/knowledge/dist/main.js']
    environment:
      KNOWLEDGE_DATABASE_URL: file:/run/secrets/db-url-aisdlc
      KNOWLEDGE_CALLERS: >-
        {"core":{"token_ref":"file:/run/secrets/tok-core-knowledge","scopes":["census","security"]},
        "core-worker":{"token_ref":"file:/run/secrets/tok-core-worker-knowledge","scopes":["census","security","search"]}}
      KNOWLEDGE_CODEHOST_URL: http://codehost:8350
      KNOWLEDGE_CODEHOST_TOKEN_REF: file:/run/secrets/tok-knowledge-codehost
      KNOWLEDGE_IDENTITY_URL: http://identity:8330
      KNOWLEDGE_IDENTITY_TOKEN_REF: file:/run/secrets/tok-knowledge-identity
      KMS_URL: http://kms-local:8300
      KMS_TOKEN_REF: file:/run/secrets/tok-knowledge-kms
      KNOWLEDGE_WORK_DIR: /work
      TMPDIR: /work
      KNOWLEDGE_HOST: 0.0.0.0
      KNOWLEDGE_PORT: '8370'
    volumes:
      - knowledge-work:/work
    secrets:
      [
        db-url-aisdlc,
        tok-core-knowledge,
        tok-core-worker-knowledge,
        tok-knowledge-codehost,
        tok-knowledge-identity,
        tok-knowledge-kms,
      ]
    healthcheck:
      test: ['CMD', 'node', '/app/healthcheck.mjs', '8370']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 8s
    depends_on:
      migrate: { condition: service_completed_successfully }
      kms-local: { condition: service_healthy }
      codehost: { condition: service_healthy }
    networks: [app, data-record, kms-clients]
    mem_limit: 256m

  # ----------------------------------------------------------------------- browser edge

  # Boundary: browser edge (AM-1, TR-5/TR-8): tokens never reach the browser; the session store and
  # the IdP client secret stay out of core. Signs step-up proofs through kms-local.
  bff:
    <<: *factory
    command: ['node', '--enable-source-maps', '/app/services/bff/dist/main.js']
    environment:
      BFF_DATABASE_URL: file:/run/secrets/db-url-aisdlc
      BFF_PUBLIC_URL: http://localhost:8340
      BFF_OIDC_ISSUER: http://dev-oidc.localhost:8390
      BFF_OIDC_CLIENT_ID: aisdlc-bff
      BFF_OIDC_CLIENT_SECRET_REF: file:/run/secrets/bff-oidc-client-secret
      KMS_URL: http://kms-local:8300
      KMS_TOKEN_REF: file:/run/secrets/tok-bff-kms
      # The portal's API calls: core with the bff's own token (scopes read, onboard, portal, work), and the
      # web bundle the image carries, served same-origin with a strict CSP.
      BFF_CORE_URL: http://core:8380
      BFF_CORE_TOKEN_REF: file:/run/secrets/tok-bff-core
      BFF_WEB_DIR: /app/services/web/dist
      # Plain http on localhost only; behind TLS this is true.
      BFF_COOKIE_SECURE: 'false'
      BFF_HOST: 0.0.0.0
      BFF_PORT: '8340'
    ports:
      - '127.0.0.1:8340:8340'
    secrets: [db-url-aisdlc, bff-oidc-client-secret, tok-bff-kms, tok-bff-core]
    healthcheck:
      test: ['CMD', 'node', '/app/healthcheck.mjs', '8340']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 8s
    depends_on:
      migrate: { condition: service_completed_successfully }
      seed: { condition: service_completed_successfully }
      kms-local: { condition: service_healthy }
      dev-oidc: { condition: service_healthy }
      core: { condition: service_healthy }
    networks: [edge, data-record, kms-clients]
    mem_limit: 256m

  # The dev identity provider (FACTORY_ENV=local only: it refuses to start otherwise). The browser
  # is redirected to it, so it is published too, and its issuer is a name both the browser and the
  # bff resolve: `dev-oidc.localhost` (a loopback name for the browser, a network alias for the bff).
  # With a real IdP (Entra) this service goes away and BFF_OIDC_* point at it.
  dev-oidc:
    <<: *factory
    command: ['node', '--enable-source-maps', '/app/services/bff/dist/dev-oidc.js']
    environment:
      FACTORY_ENV: local
      DEV_OIDC_USERS_FILE: /config/dev-oidc-users.json
      DEV_OIDC_CLIENT_ID: aisdlc-bff
      DEV_OIDC_CLIENT_SECRET_REF: file:/run/secrets/bff-oidc-client-secret
      DEV_OIDC_REDIRECT_URIS: http://localhost:8340/auth/callback
      DEV_OIDC_ISSUER: http://dev-oidc.localhost:8390
      DEV_OIDC_HOST: 0.0.0.0
      DEV_OIDC_PORT: '8390'
    ports:
      - '127.0.0.1:8390:8390'
    volumes:
      - ./config/dev-oidc-users.json:/config/dev-oidc-users.json:ro
    secrets: [bff-oidc-client-secret]
    healthcheck:
      test: ['CMD', 'node', '/app/healthcheck.mjs', '8390', '/.well-known/openid-configuration']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks:
      edge:
        aliases: [dev-oidc.localhost]
    mem_limit: 128m

  # ------------------------------------------------------- the sandbox plane (a profile, PLAN M13.2)

  # THE ONLY CONTAINERS THAT MOUNT THE DOCKER SOCKET (smoke.sh checks it: exactly these two). Each is a small
  # allow-list HTTP proxy (services/docker-proxy): containers create/start/wait/logs/inspect/kill/delete of
  # sandboxes, and (coding instance only) the per-session internal networks. Never exec, build, image pull,
  # volumes, privileged, host namespaces, devices, added capabilities, or a bind mount other than the session's
  # read-only repo copy under the scratch root; never a container that is not labelled as a sandbox. `:ro` on a
  # socket mount does not limit API verbs: the proxy does. It runs as the factory uid with the socket's group
  # added (DOCKER_GID, `stat -c %g /var/run/docker.sock`; smoke.sh sets it). Needs `docker build -t
  # aisdlc/sandbox:local platform/sandbox` first (smoke.sh does it).
  docker-proxy-cvw:
    <<: *factory
    profiles: [sandbox]
    command: ['node', '--enable-source-maps', '/app/services/docker-proxy/dist/main.js']
    group_add: ['${DOCKER_GID:-0}']
    environment:
      DOCKER_PROXY_MODE: cvw
      # the internal network is not an identity: every TCP caller presents its own bearer token (file: references)
      DOCKER_PROXY_CALLERS: cvw=file:/run/secrets/tok-cvw-docker-cvw
      DOCKER_PROXY_IMAGES: ${SANDBOX_IMAGE:-aisdlc/sandbox:local},${SANDBOX_AGENT_IMAGE:-aisdlc/sandbox-agent:local}
      DOCKER_PROXY_SCRATCH_ROOT: ${SANDBOX_SCRATCH:-/var/lib/aisdlc/sandbox-scratch}
      DOCKER_PROXY_HOST: 0.0.0.0
      DOCKER_PROXY_PORT: '2375'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ['CMD', 'node', '/app/healthcheck.mjs', '2375']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 3s
    secrets: [tok-cvw-docker-cvw]
    networks: [docker-cvw]
    mem_limit: 64m

  # The wider instance, for the coding worker: the same list plus the per-session internal networks and the
  # attach of the gateway and the mirror to them. Still no exec, no build, no pull, no volume, one coding
  # session at a time (also counted here, from the daemon).
  docker-proxy-coding:
    <<: *factory
    profiles: [sandbox]
    command: ['node', '--enable-source-maps', '/app/services/docker-proxy/dist/main.js']
    group_add: ['${DOCKER_GID:-0}']
    environment:
      DOCKER_PROXY_MODE: coding
      # M14.2: the sandbox-controller is the one service that drives it (core-worker no longer holds a token here)
      DOCKER_PROXY_CALLERS: sandbox-controller=file:/run/secrets/tok-sandbox-controller-docker-coding,smoke=file:/run/secrets/tok-smoke-docker-coding
      DOCKER_PROXY_IMAGES: ${SANDBOX_IMAGE:-aisdlc/sandbox:local},${SANDBOX_AGENT_IMAGE:-aisdlc/sandbox-agent:local}
      DOCKER_PROXY_SCRATCH_ROOT: ${SANDBOX_SCRATCH:-/var/lib/aisdlc/sandbox-scratch}
      DOCKER_PROXY_MAX_SANDBOXES: '4'
      DOCKER_PROXY_CODING_CAP: '1'
      DOCKER_PROXY_HOST: 0.0.0.0
      DOCKER_PROXY_PORT: '2375'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ['CMD', 'node', '/app/healthcheck.mjs', '2375']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 3s
    secrets: [tok-sandbox-controller-docker-coding, tok-smoke-docker-coding]
    networks: [docker-coding]
    mem_limit: 64m

  # The sandbox-controller (M14.2; ADR-0003 §6 "Placement", §7 caps): the one client of the coding proxy. It owns the
  # sandbox driver, the class ceilings and the two caps of this runner host (`sandbox.caps`, M1-gated config: a total,
  # default 4, and a coding (W) cap, default 1), starts only a session whose admission grant core recorded as active
  # (it reads `core.admission_grant`), never queues (over a cap it answers `busy` and core's admission waits), and
  # reports the free slots H2 reads. Its state is the running sessions, in memory: disposable. It holds the coding
  # proxy's token and the gateway virtual key of a running session (passed through, never stored), and no other secret.
  # The scratch directory is mounted at the SAME path the daemon sees (a session's read-only repo copy is a bind of it).
  sandbox-controller:
    <<: *factory
    profiles: [sandbox]
    command: ['node', '--enable-source-maps', '/app/services/sandbox-controller/dist/main.js']
    environment:
      # its own least-privilege role (db-init.sh; the config and core migrations grant it two relations)
      SANDBOX_CONTROLLER_DATABASE_URL: file:/run/secrets/db-url-sandbox-controller
      SANDBOX_CONTROLLER_CALLERS: >-
        {"core-worker":{"token_ref":"file:/run/secrets/tok-core-worker-sandbox-controller","scopes":["run","read"]},
        "operator":{"token_ref":"file:/run/secrets/tok-operator-sandbox-controller","scopes":["read","admin"]},
        "verify":{"token_ref":"file:/run/secrets/tok-verify-sandbox-controller","scopes":["run"]}}
      SANDBOX_CONTROLLER_HOST_ID: local
      SANDBOX_CONTROLLER_PROXY_URL: http://docker-proxy-coding:2375
      SANDBOX_CONTROLLER_PROXY_TOKEN_REF: file:/run/secrets/tok-sandbox-controller-docker-coding
      SANDBOX_CONTROLLER_IMAGE: ${SANDBOX_AGENT_IMAGE:-aisdlc/sandbox-agent:local}
      SANDBOX_CONTROLLER_SCRATCH: ${SANDBOX_SCRATCH:-/var/lib/aisdlc/sandbox-scratch}
      SANDBOX_CONTROLLER_MIRROR: ${COMPOSE_PROJECT_NAME:-aisdlc}-package-mirror
      SANDBOX_CONTROLLER_GATEWAY: ${COMPOSE_PROJECT_NAME:-aisdlc}-gateway
      SANDBOX_CONTROLLER_HOST: 0.0.0.0
      SANDBOX_CONTROLLER_PORT: '8430'
    volumes:
      - ${SANDBOX_SCRATCH:-/var/lib/aisdlc/sandbox-scratch}:${SANDBOX_SCRATCH:-/var/lib/aisdlc/sandbox-scratch}
    secrets:
      [
        db-url-sandbox-controller,
        tok-sandbox-controller-docker-coding,
        tok-core-worker-sandbox-controller,
        tok-operator-sandbox-controller,
        tok-verify-sandbox-controller,
      ]
    healthcheck:
      test: ['CMD', 'node', '/app/healthcheck.mjs', '8430']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    depends_on:
      migrate: { condition: service_completed_successfully }
      docker-proxy-coding: { condition: service_healthy }
    networks: [data-sandbox-controller, sandbox-controller-api, docker-coding]
    mem_limit: 512m

  # The verify service (M14.3; ADR-0003 §1 Control plane, the plan's `cvw`): S7's checks 7.1 to 7.5 over a Unit head.
  # It holds no vendor key, no code-host credential and no Docker right: the repo comes from the codehost's bundle
  # route, every kit (the repo's commands, the stub probe, the mutants, the holdouts, in class O: no key, the mirror
  # only) is a session the sandbox-controller places under the item's admission grant, and the A5 reviewer of 7.3 and
  # 7.5 is one gateway call under the run's own key, lent for that call. Each result is a record event on its own
  # `verify:` stream before it is answered. Its own database role (db-init.sh, the verify migration).
  verify:
    <<: *factory
    profiles: [sandbox]
    command: ['node', '--enable-source-maps', '/app/services/verify/dist/main.js']
    environment:
      VERIFY_DATABASE_URL: file:/run/secrets/db-url-verify
      VERIFY_CALLERS: >-
        {"core-worker":{"token_ref":"file:/run/secrets/tok-core-worker-verify","scopes":["run","read"]}}
      VERIFY_SANDBOX_CONTROLLER_URL: http://sandbox-controller:8430
      VERIFY_SANDBOX_CONTROLLER_TOKEN_REF: file:/run/secrets/tok-verify-sandbox-controller
      VERIFY_CODEHOST_URL: http://codehost:8350
      VERIFY_CODEHOST_TOKEN_REF: file:/run/secrets/tok-verify-codehost
      VERIFY_GATEWAY_URL: http://gateway:8410
      TMPDIR: /tmp
      VERIFY_HOST: 0.0.0.0
      VERIFY_PORT: '8440'
    secrets:
      [db-url-verify, tok-core-worker-verify, tok-verify-sandbox-controller, tok-verify-codehost]
    healthcheck:
      test: ['CMD', 'node', '/app/healthcheck.mjs', '8440']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    depends_on:
      migrate: { condition: service_completed_successfully }
      sandbox-controller: { condition: service_healthy }
      codehost: { condition: service_healthy }
      gateway: { condition: service_healthy }
    networks: [data-verify, verify-api, verify-codehost, sandbox-controller-api, gateway-api]
    mem_limit: 256m

  # The package mirror (RV §2: with the gateway, the ONLY thing a sandbox reaches): a read-only HTTP server over
  # a fixed directory, on an internal network, no upstream. The fixture set is empty until the real wheels are
  # chosen (DEC-17), so a package manager pointed at it fails closed. A sandbox network peer, by label and name.
  package-mirror:
    <<: *factory
    profiles: [sandbox]
    container_name: ${COMPOSE_PROJECT_NAME:-aisdlc}-package-mirror
    labels:
      aisdlc.sandbox.peer: mirror
    command: ['node', '--enable-source-maps', '/app/services/package-mirror/dist/main.js']
    environment:
      PACKAGE_MIRROR_ROOT: /fixtures
      PACKAGE_MIRROR_HOST: 0.0.0.0
      PACKAGE_MIRROR_PORT: '8420'
    volumes:
      - ../../services/package-mirror/fixtures:/fixtures:ro
    healthcheck:
      test: ['CMD', 'node', '/app/healthcheck.mjs', '8420']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 3s
    networks: [sandbox-mirror]
    mem_limit: 64m

  # smoke.sh's client (profile `sandbox-smoke`, run with `docker compose run`): starts one K session and one
  # K-exec through the coding proxy and asks it for what a compromised worker would. The scratch directory is
  # mounted at the SAME path the daemon sees (the sandbox's read-only repo copy is a bind of it).
  sandbox-smoke:
    <<: *factory
    profiles: [sandbox-smoke]
    restart: 'no'
    command: ['node', '--enable-source-maps', '/app/services/sandbox-driver/dist/smoke.js']
    environment:
      SANDBOX_PROXY: http://docker-proxy-coding:2375
      SANDBOX_PROXY_TOKEN_REF: file:/run/secrets/tok-smoke-docker-coding
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-aisdlc/sandbox:local}
      SANDBOX_AGENT_IMAGE: ${SANDBOX_AGENT_IMAGE:-aisdlc/sandbox-agent:local}
      SANDBOX_SCRATCH: ${SANDBOX_SCRATCH:-/var/lib/aisdlc/sandbox-scratch}
      SANDBOX_MIRROR: ${COMPOSE_PROJECT_NAME:-aisdlc}-package-mirror
      SANDBOX_GATEWAY: ${COMPOSE_PROJECT_NAME:-aisdlc}-gateway
    volumes:
      - ${SANDBOX_SCRATCH:-/var/lib/aisdlc/sandbox-scratch}:${SANDBOX_SCRATCH:-/var/lib/aisdlc/sandbox-scratch}
    secrets: [tok-smoke-docker-coding]
    networks: [docker-coding]
    mem_limit: 128m

  # ------------------------------------------------------------------- the object store (M14.1)

  # S3-compatible object store for large content (ADR-0003 §2): Evidence Packs from M14.4. MinIO here, any S3
  # service in the cloud (the adapter is `S3ObjectStore`, packages/ports). The adapter creates and checks the
  # buckets itself (`declareBucket`; a write-once bucket is created with Object Lock), so there is no init job.
  # Root credentials are the two secret files, read through MinIO's `_FILE` variables. Image: Chainguard's
  # build of MinIO, pinned by digest (the upstream minio/minio images are no longer published to Docker Hub).
  # Its only tools are coreutils and bash, so the healthcheck is a bash /dev/tcp probe of /minio/health/live.
  # Not a dependency of any service yet.
  object-store:
    image: chainguard/minio@sha256:db3f583fa49121942168bd6383a773b2cde3384c9a99bf7193560b9a0f3a28fd
    user: '${AISDLC_UID:?run ./init-secrets first}:${AISDLC_GID:?run ./init-secrets first}'
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64m
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }
    command: ['server', '/data', '--address', ':9000', '--quiet']
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/object-store-access-key
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/object-store-secret-key
      MINIO_BROWSER: 'off'
      HOME: /tmp
    volumes:
      - objectstore-data:/data
    secrets: [object-store-access-key, object-store-secret-key]
    healthcheck:
      test:
        - CMD
        - /usr/bin/bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/9000 && printf "GET /minio/health/live HTTP/1.1\r\nHost: 127.0.0.1\r\nConnection: close\r\n\r\n" >&3 && read -r l <&3 && [[ "$$l" == *" 200 "* ]]'
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    networks: [objectstore-api]
    mem_limit: 512m

  # ------------------------------------------------------------- the fake GitHub (a profile)

  # Not a service of the factory: the other end of the codehost's egress. The in-repo fake GitHub
  # REST server and a git server over one seeded repository (reshif/asf-factory-testbed), in the
  # codehost's own network namespace because the codehost accepts plain http to loopback only (it
  # carries credentials). It prints every request it gets; the live-exit evidence that the factory
  # only reads is `docker compose logs fake-github`.
  fake-github:
    <<: *factory
    profiles: [fake-github]
    network_mode: 'service:codehost'
    command: ['node', '--enable-source-maps', '/app/services/codehost/dist/fake-github.js']
    environment:
      FAKE_GITHUB_APP_ID: ${GITHUB_APP_ID:?run ./init-secrets first}
      FAKE_GITHUB_INSTALLATION_ID: ${GITHUB_INSTALLATION_ID:?run ./init-secrets first}
      FAKE_GITHUB_APP_PUBLIC_KEY_FILE: /run/secrets/github-app.pub.pem
      FAKE_GITHUB_API_PORT: '8353'
      FAKE_GITHUB_GIT_PORT: '8354'
      FAKE_GITHUB_DIR: /tmp/fake-github
    secrets: [github-app.pub.pem]
    healthcheck:
      test: ['CMD', 'node', '/app/healthcheck.mjs', '8353']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    depends_on:
      codehost: { condition: service_started }
    mem_limit: 128m
