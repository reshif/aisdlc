  tok-core-worker-notary: { file: ./secrets/tok-core-worker-notary }
  tok-identity-notary: { file: ./secrets/tok-identity-notary }
  tok-core-worker-witness: { file: ./secrets/tok-core-worker-witness }
  tok-core-worker-identity: { file: ./secrets/tok-core-worker-identity }
  tok-codehost-identity: { file: ./secrets/tok-codehost-identity }
  tok-knowledge-identity: { file: ./secrets/tok-knowledge-identity }
  tok-seed-identity: { file: ./secrets/tok-seed-identity }
  tok-codehost-core: { file: ./secrets/tok-codehost-core }
  tok-identity-core: { file: ./secrets/tok-identity-core }
  tok-core-identity: { file: ./secrets/tok-core-identity }
  tok-operator-core: { file: ./secrets/tok-operator-core }
  tok-core-knowledge: { file: ./secrets/tok-core-knowledge }
  tok-core-worker-knowledge: { file: ./secrets/tok-core-worker-knowledge }
  tok-knowledge-codehost: { file: ./secrets/tok-knowledge-codehost }
  tok-core-codehost: { file: ./secrets/tok-core-codehost }
  tok-core-worker-codehost: { file: ./secrets/tok-core-worker-codehost }
  tok-sandbox-controller-docker-coding: { file: ./secrets/tok-sandbox-controller-docker-coding }
  tok-core-worker-sandbox-controller: { file: ./secrets/tok-core-worker-sandbox-controller }
  tok-operator-sandbox-controller: { file: ./secrets/tok-operator-sandbox-controller }
  tok-core-worker-verify: { file: ./secrets/tok-core-worker-verify }
  tok-verify-codehost: { file: ./secrets/tok-verify-codehost }
  tok-verify-sandbox-controller: { file: ./secrets/tok-verify-sandbox-controller }
  # the Push Broker's key: the factory App's (setup-github-apps writes the same key here and to github-app.pem);
  # AISDLC_PUSH_BROKER_KEY lets a run point it at github-app (e2e-pr's two-App layout on the fake GitHub)
  push-broker-app.pem: { file: './secrets/${AISDLC_PUSH_BROKER_KEY:-push-broker-app}.pem' }
  push-broker-app.pub.pem: { file: './secrets/${AISDLC_PUSH_BROKER_KEY:-push-broker-app}.pub.pem' }
  tok-core-worker-push-broker: { file: ./secrets/tok-core-worker-push-broker }
  tok-core-push-broker: { file: ./secrets/tok-core-push-broker }
  tok-push-broker-core: { file: ./secrets/tok-push-broker-core }
  tok-push-broker-identity: { file: ./secrets/tok-push-broker-identity }
  tok-smoke-docker-coding: { file: ./secrets/tok-smoke-docker-coding }
  tok-cvw-docker-cvw: { file: ./secrets/tok-cvw-docker-cvw }
  object-store-access-key: { file: ./secrets/object-store-access-key }
  object-store-secret-key: { file: ./secrets/object-store-secret-key }

services:
  # ------------------------------------------------------------------------------------ data

  # Boundary: record vs execution databases (AR1, C47) and a database per key holder. One server
  # here, three databases and three roles (cloud: separate clusters).
  postgres:
    image: postgres:16.4@sha256:e62fbf9d3e2b49816a32c400ed2dba83e3b361e6833e624024309c35d334b412
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/pg-superuser
    command: ['postgres', '-c', 'max_connections=100', '-c', 'shared_buffers=64MB']
    volumes:
      - pgdata:/var/lib/postgresql/data
    secrets: [pg-superuser]
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      [
        data-record,
        data-notary,
        data-witness,
        data-killswitch,
        data-gateway,
        data-sandbox-controller,
        data-verify,
        data-gatecheck,
        data-gaterelay,
        data-notifier,
        data-audit,
      ]
    mem_limit: 512m
    shm_size: 64m

  # The init step: roles and databases (record, notary, witness, killswitch), idempotent.
  db-init:
    image: postgres:16.4@sha256:e62fbf9d3e2b49816a32c400ed2dba83e3b361e6833e624024309c35d334b412
    user: '${AISDLC_UID:?run ./init-secrets first}:${AISDLC_GID:?run ./init-secrets first}'
    restart: 'no'
    read_only: true
    tmpfs: ['/tmp:mode=1777,size=16m']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    entrypoint: ['sh', '/db-init.sh']
    environment:
      PGHOST: postgres
    volumes:
      - ./db-init.sh:/db-init.sh:ro
    secrets:
      [
        pg-superuser,
        pg-pass-aisdlc,
        pg-pass-notary,
        pg-pass-witness,
        pg-pass-killswitch,
        pg-pass-gateway,
        pg-pass-sandbox-controller,
        pg-pass-verify,
        pg-pass-gate-check,
        pg-pass-gate-relay,
        pg-pass-notifier,
        pg-pass-audit,
      ]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [data-record, data-notary, data-witness, data-killswitch]
    mem_limit: 64m

  # `aisdlc-migrate` first: every schema in dependency order, the Notary's, the Witness's and the kill
  # switch's databases too (--notary --witness --killswitch). This service also builds the image (see Dockerfile).
  migrate:
    <<: *factory
    build:
      context: ../..
      dockerfile: platform/compose/Dockerfile
      # Unset: the Dockerfile's pinned images. Set RUNTIME_IMAGE to a base that already has git.
      args: [RUNTIME_IMAGE]
    restart: 'no'
    command:
      [
        'node',
        '/app/packages/migrate/dist/aisdlc-migrate.js',
        '--notary',
        '--witness',
        '--killswitch',
      ]
    environment:
      AISDLC_DATABASE_URL: file:/run/secrets/db-url-aisdlc
      AISDLC_NOTARY_DATABASE_URL: file:/run/secrets/db-url-notary
      AISDLC_WITNESS_DATABASE_URL: file:/run/secrets/db-url-witness
      AISDLC_KILLSWITCH_DATABASE_URL: file:/run/secrets/db-url-killswitch
    secrets: [db-url-aisdlc, db-url-notary, db-url-witness, db-url-killswitch]
    depends_on:
      db-init: { condition: service_completed_successfully }
    networks: [data-record, data-notary, data-witness, data-killswitch]
    mem_limit: 192m

  # ---------------------------------------------------------------------------- trust plane

  # Boundary: key custody. The only holder of the Notary, Witness, kill switch, step-up and fingerprint keys;
  # signs digests and MACs by key id and never hands a key out. dev: keys, so it refuses to start
  # unless FACTORY_ENV=local (cloud: AWS KMS, Notary and Witness in separate accounts).
  kms-local:
    <<: *factory
    command: ['node', '--enable-source-maps', '/app/services/kms-local/dist/main.js']
    environment:
      # M19: OTLP/HTTP export to the collector (profile `telemetry`) on its own network `telemetry-kms-local`
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      FACTORY_ENV: local
      KMS_DIR: /kms
      KMS_HOST: 0.0.0.0
      KMS_PORT: '8300'
      # Callers that may use a key (RV §2 allow-list) and callers that only read public keys (keys: []).
      KMS_CALLERS: >-
        {"notary":{"token_ref":"file:/run/secrets/tok-notary-kms"},
        "witness":{"token_ref":"file:/run/secrets/tok-witness-kms"},
        "knowledge":{"token_ref":"file:/run/secrets/tok-knowledge-kms"},
        "bff":{"token_ref":"file:/run/secrets/tok-bff-kms"},
        "killswitch":{"token_ref":"file:/run/secrets/tok-killswitch-kms"},
        "core":{"token_ref":"file:/run/secrets/tok-core-kms","keys":[]},
        "core-worker":{"token_ref":"file:/run/secrets/tok-core-worker-kms","keys":[]},
        "identity":{"token_ref":"file:/run/secrets/tok-identity-kms","keys":[]},
        "gate-check":{"token_ref":"file:/run/secrets/tok-gate-check-kms","keys":[]},
        "gate-relay":{"token_ref":"file:/run/secrets/tok-gate-relay-kms","keys":[]},
        "audit":{"token_ref":"file:/run/secrets/tok-audit-kms","keys":[]}}
    volumes:
      - kms-state:/kms
    secrets:
      [
        tok-notary-kms,
        tok-witness-kms,
        tok-knowledge-kms,
        tok-bff-kms,
        tok-killswitch-kms,
        tok-core-kms,
        tok-core-worker-kms,
        tok-identity-kms,
        tok-gate-check-kms,
        tok-gate-relay-kms,
        tok-audit-kms,
      ]
    healthcheck:
      test: ['CMD', 'node', '/app/healthcheck.mjs', '8300']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [kms-notary, kms-witness, kms-killswitch, kms-clients, telemetry-kms-local]
    mem_limit: 128m

  # Boundary: ledger signer (C08n "the only signer", AR1). Its own database and role.
  notary:
    <<: *factory
    command: ['node', '--enable-source-maps', '/app/services/notary/dist/main.js']
    environment:
      # M19: OTLP/HTTP export to the collector (profile `telemetry`) on its own network `telemetry-notary`
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      NOTARY_DATABASE_URL: file:/run/secrets/db-url-notary
      NOTARY_CALLERS: >-
        {"core":{"token_ref":"file:/run/secrets/tok-core-notary","scopes":["ledger","read"]},
        "core-worker":{"token_ref":"file:/run/secrets/tok-core-worker-notary","scopes":["ledger","read","checkpoint","evidence"]},
        "identity":{"token_ref":"file:/run/secrets/tok-identity-notary","scopes":["ledger","read"]},
        "audit":{"token_ref":"file:/run/secrets/tok-audit-notary","scopes":["ledger","read","audit_export"]}}
      KMS_URL: http://kms-local:8300
      KMS_TOKEN_REF: file:/run/secrets/tok-notary-kms
      NOTARY_HOST: 0.0.0.0
      NOTARY_PORT: '8310'
    secrets:
      [
        db-url-notary,
        tok-core-notary,
        tok-core-worker-notary,
        tok-identity-notary,
        tok-audit-notary,
        tok-notary-kms,
      ]
    healthcheck:
      test: ['CMD', 'node', '/app/healthcheck.mjs', '8310']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    depends_on:
      migrate: { condition: service_completed_successfully }
      kms-local: { condition: service_healthy }
    networks: [kms-notary, notary-api, data-notary, telemetry-notary]
    mem_limit: 128m

  # Boundary: AR9 independence. The second signer of every checkpoint, with a database, a role and a
  # key of its own, and no route to the Notary. Its one caller is core-worker's checkpointer loop
  # (M8.0b), which mounts tok-core-worker-witness.
  witness:
    <<: *factory
    command: ['node', '--enable-source-maps', '/app/services/witness/dist/main.js']
    environment:
      # M19: OTLP/HTTP export to the collector (profile `telemetry`) on its own network `telemetry-witness`
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      WITNESS_DATABASE_URL: file:/run/secrets/db-url-witness
      WITNESS_CALLERS: >-
        {"core-worker":{"token_ref":"file:/run/secrets/tok-core-worker-witness"}}
      KMS_URL: http://kms-local:8300
      KMS_TOKEN_REF: file:/run/secrets/tok-witness-kms
      WITNESS_HOST: 0.0.0.0
      WITNESS_PORT: '8320'
    secrets: [db-url-witness, tok-core-worker-witness, tok-witness-kms]
    healthcheck:
      test: ['CMD', 'node', '/app/healthcheck.mjs', '8320']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    depends_on:
      migrate: { condition: service_completed_successfully }
      kms-local: { condition: service_healthy }
    networks: [kms-witness, witness-api, data-witness, telemetry-witness]
    mem_limit: 128m

  # Boundary: AR9 independence. The kill switch has its own database and role, its own key
  # (`dev:killswitch`, which no other caller of kms-local may use) and its own network. It depends on
  # nothing of core's or Temporal's and has no route to core's write or command APIs: it is on no
  # network of core's and holds no token of core's. Core-worker READS it (admission, the journal) and
  # PUSHES to it (who holds what); the operator token is for a person's kill when core is down.
  # Factory admins (the only people who may kill the fleet) are its own configuration.
  killswitch:
    <<: *factory
    command: ['node', '--enable-source-maps', '/app/services/killswitch/dist/main.js']
    environment:
      # M19: OTLP/HTTP export to the collector (profile `telemetry`) on its own network `telemetry-killswitch`
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      KILLSWITCH_DATABASE_URL: file:/run/secrets/db-url-killswitch
      KILLSWITCH_CALLERS: >-
        {"core-worker":{"token_ref":"file:/run/secrets/tok-core-worker-killswitch","scopes":["read","sync"]},
        "operator":{"token_ref":"file:/run/secrets/tok-operator-killswitch","scopes":["act","read"]},
        "gateway":{"token_ref":"file:/run/secrets/tok-gateway-killswitch","scopes":["read"]},
        "bff":{"token_ref":"file:/run/secrets/tok-bff-killswitch","scopes":["act","read"]}}
      KILLSWITCH_FACTORY_ADMINS: '["alice","bob"]'
      KMS_URL: http://kms-local:8300
      KMS_TOKEN_REF: file:/run/secrets/tok-killswitch-kms
      KILLSWITCH_HOST: 0.0.0.0
      KILLSWITCH_PORT: '8400'
    secrets:
      [
        db-url-killswitch,
        tok-core-worker-killswitch,
        tok-operator-killswitch,
        tok-gateway-killswitch,
        tok-bff-killswitch,
        tok-killswitch-kms,
      ]
    healthcheck:
      test: ['CMD', 'node', '/app/healthcheck.mjs', '8400']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    depends_on:
      migrate: { condition: service_completed_successfully }
      kms-local: { condition: service_healthy }
    networks:
      [
        kms-killswitch,
        killswitch-api,
        killswitch-gateway,
        data-killswitch,
        telemetry-killswitch,
        killswitch-bff,
      ]
    mem_limit: 128m

  # Boundary: model key custody (RV §2, AR5, AR7). EVERY model call of the factory goes through here and
  # this is the only container that mounts a vendor key (`anthropic-api-key`, a file; no other service
  # can read it and it is in no environment, log, response or record event). It routes by (environment,
  # data class) from the published config (D3 has no route), meters every call as a record event, holds
  # the per-Unit virtual keys (hashed), budgets, redaction and the tool allow-list, and asks the kill
  # switch before every call. It shares the record database (it appends `gateway.*` events and reads
  # config) over a network of its own (`data-gateway`, shared with Postgres only) and has no route to
  # kms-local, the Notary, the Witness, core or any other record service: its networks are its own
  # API, the kill switch's read link, Postgres (a network of its own) and its egress. Egress is a whole network
  # here; the cloud target is a security group or proxy that allows api.anthropic.com only.
  # Local-prod routes D0-D2 to the deterministic fake provider (the seed publishes that table); a
  # gated config revision points a route at Claude. `core-worker` mints the agents' per-Unit and per-job keys
  # (M11, M12), `core` the assistant's per-ask keys (M18); the operator token is how a person (or smoke.sh) reaches it.
  gateway:
    <<: *factory
    # A sandbox network peer (M13.2): the coding proxy attaches a container to a session network only if it
    # carries this label, and by name, so the name is fixed. Sandboxes of a class with a key reach it at
    # `gateway:8410` with their per-Unit virtual key and at nothing else.
    container_name: ${COMPOSE_PROJECT_NAME:-aisdlc}-gateway
    labels:
      aisdlc.sandbox.peer: gateway
    command: ['node', '--enable-source-maps', '/app/services/gateway/dist/main.js']
    environment:
      # M19: OTLP/HTTP export to the collector (profile `telemetry`) on its own network `telemetry-gateway`
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      # The least-privilege role `gateway` (db-init.sh, the gateway migration), NOT the `aisdlc` owner.
      GATEWAY_DATABASE_URL: file:/run/secrets/db-url-gateway
      GATEWAY_ENVIRONMENT: local
      GATEWAY_CALLERS: >-
        {"core":{"token_ref":"file:/run/secrets/tok-core-gateway","scopes":["admin","read"]},
        "core-worker":{"token_ref":"file:/run/secrets/tok-core-worker-gateway","scopes":["admin","read"]},
        "operator":{"token_ref":"file:/run/secrets/tok-operator-gateway","scopes":["admin","read"]}}
      # What this deployment lets a registry row do. The providers themselves (adapter, base URL, key
      # reference, models) are rows of the integration registry, published through an M1 gate; a row naming
      # another key file or host is refused.
      GATEWAY_SECRET_REFS: '["file:/run/secrets/anthropic-api-key"]'
      GATEWAY_EGRESS_HOSTS: '["api.anthropic.com"]'
      GATEWAY_KILLSWITCH_URL: http://killswitch:8400
      GATEWAY_KILLSWITCH_TOKEN_REF: file:/run/secrets/tok-gateway-killswitch
      GATEWAY_MAX_PROVIDER_CALLS: ${GATEWAY_MAX_PROVIDER_CALLS:-1000}
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: '8410'
    secrets:
      [
        db-url-gateway,
        anthropic-api-key,
        tok-core-gateway,
        tok-core-worker-gateway,
        tok-operator-gateway,
        tok-gateway-killswitch,
      ]
    healthcheck:
      test: ['CMD', 'node', '/app/healthcheck.mjs', '8410']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 8s
    depends_on:
      migrate: { condition: service_completed_successfully }
      killswitch: { condition: service_healthy }
    networks: [data-gateway, gateway-api, killswitch-gateway, gateway-egress, telemetry-gateway]
    mem_limit: 192m

  # ------------------------------------------------------------------- identity and the seed

  # Boundary: identity and PDP source (AR2): the policy source and its journal are not shared with
  # the systems they police. Policy evaluation itself is embedded in core and the bff.
  identity:
    <<: *factory
    command: ['node', '--enable-source-maps', '/app/services/identity/dist/main.js']
    environment:
      # M19: OTLP/HTTP export to the collector (profile `telemetry`): set OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      IDENTITY_DATABASE_URL: file:/run/secrets/db-url-aisdlc
      IDENTITY_CALLERS: >-
        {"core-worker":{"token_ref":"file:/run/secrets/tok-core-worker-identity","scopes":["reconcile"]},
        "codehost":{"token_ref":"file:/run/secrets/tok-codehost-identity","scopes":["read","codeowners"]},
        "knowledge":{"token_ref":"file:/run/secrets/tok-knowledge-identity","scopes":["read"]},
        "seed":{"token_ref":"file:/run/secrets/tok-seed-identity","scopes":["read","write","sync"]},
        "push-broker":{"token_ref":"file:/run/secrets/tok-push-broker-identity","scopes":["read"]},
        "core":{"token_ref":"file:/run/secrets/tok-core-identity","scopes":["grant"]}}
      NOTARY_URL: http://notary:8310
      IDENTITY_NOTARY_TOKEN_REF: file:/run/secrets/tok-identity-notary
      KMS_URL: http://kms-local:8300
      KMS_TOKEN_REF: file:/run/secrets/tok-identity-kms
      IDENTITY_IDP_SEED_FILE: /config/idp-seed.json
      # Project settings live in core: read over its API (scope read), lazily, so identity starts first.
      IDENTITY_CORE_URL: http://core:8380
      IDENTITY_CORE_TOKEN_REF: file:/run/secrets/tok-identity-core
      IDENTITY_HOST: 0.0.0.0
      IDENTITY_PORT: '8330'
    volumes:
      # the IdP seed names the dev IdP as issuer by name and port: a stack on another AISDLC_OIDC_PORT mounts its own copy
      - ${AISDLC_IDP_SEED_FILE:-./config/idp-seed.json}:/config/idp-seed.json:ro
    secrets:
      [
        db-url-aisdlc,
        tok-core-worker-identity,
        tok-codehost-identity,
        tok-knowledge-identity,
        tok-seed-identity,
        tok-core-identity,
        tok-identity-notary,
        tok-identity-kms,
        tok-identity-core,
        tok-push-broker-identity,
      ]
    healthcheck:
      test: ['CMD', 'node', '/app/healthcheck.mjs', '8330']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 8s
    depends_on:
      migrate: { condition: service_completed_successfully }
      notary: { condition: service_healthy }
      kms-local: { condition: service_healthy }
    networks: [app, data-record, kms-clients, notary-api, telemetry, pushbroker]
    mem_limit: 192m

  # First-run bootstrap, LOCAL ONLY (refuses unless FACTORY_ENV=local): makes the factory admin a
  # `factory.admin` through identity's API and publishes the policy bundle through its M1 gate.
  # Without it every decision is a deny and nobody may onboard anything. It runs as core (core's
  # Notary and KMS tokens). Idempotent.
  seed:
    <<: *factory
    restart: 'no'
    command: ['node', '--enable-source-maps', '/app/services/core/dist/aisdlc-seed.js']
    environment:
      FACTORY_ENV: local
      CORE_DATABASE_URL: file:/run/secrets/db-url-aisdlc
      CORE_NOTARY_URL: http://notary:8310
      CORE_NOTARY_TOKEN_REF: file:/run/secrets/tok-core-notary
      KMS_URL: http://kms-local:8300
      KMS_TOKEN_REF: file:/run/secrets/tok-core-kms
      SEED_IDENTITY_URL: http://identity:8330
      SEED_IDENTITY_TOKEN_REF: file:/run/secrets/tok-seed-identity
      SEED_FACTORY_ADMIN: alice
      # the design personas (lt, oh, nf, mw, tb, ...): their IdP groups (config/idp-seed.json) bound to their fleet,
      # team and viewer roles; project slot roles come from a project's role map once it is onboarded
      SEED_PERSONAS: '1'
      # The GitHub App is the first code-host row of the integration registry (ids and a key REFERENCE;
      # the key itself stays in the codehost's own file).
      SEED_GITHUB_APP_ID: ${GITHUB_APP_ID:?run ./init-secrets first}
      SEED_GITHUB_INSTALLATION_ID: ${GITHUB_INSTALLATION_ID:?run ./init-secrets first}
      SEED_GITHUB_APP_KEY_REF: file:/run/secrets/github-app.pem
      SEED_GITHUB_API_URL: ${CODEHOST_GITHUB_API_URL:-}
      SEED_GITHUB_GIT_URL: ${CODEHOST_GIT_URL:-}
      # The local sandbox settings, each published through its own M1 gate when set (e2e-pr.sh sets them; empty: the
      # defaults, nothing runs): DEC-18's allow-list, the onboarding probe image and the W image LF4 is about (the
      # sandbox-controller's SANDBOX_AGENT_IMAGE_ID must be the same image), and the fake provider's fixture set
      SEED_EXEC_ALLOWED_REPOS: ${SEED_EXEC_ALLOWED_REPOS:-}
      SEED_ONBOARDING_SANDBOX_IMAGE: ${SANDBOX_ONBOARDING_IMAGE:-}
      SEED_ONBOARDING_LOCK_SHA256: ${SANDBOX_ONBOARDING_LOCK_SHA256:-}
      SEED_WORKER_IMAGE: ${SANDBOX_AGENT_IMAGE_ID:-}
      SEED_FAKE_FIXTURES: ${SEED_FAKE_FIXTURES:-planning}
    secrets: [db-url-aisdlc, tok-core-notary, tok-core-kms, tok-seed-identity]
    depends_on:
      migrate: { condition: service_completed_successfully }
      identity: { condition: service_healthy }
      notary: { condition: service_healthy }
    networks: [app, data-record, kms-clients, notary-api]
    mem_limit: 192m

  # M19, the load test (profile `load`; platform/compose/load.sh runs it, never `up`): a one-shot client of the stack, not
  # a service. `seed` writes the load projects (FACTORY_ENV=local only: an active PRR no onboarding decided, the first
  # settings decided under a genesis eligibility, as `seed` above does for the factory); `run` submits the items through
  # core's API with the bff's token (the person in `on_behalf_of`, decided by the PDP), acts for the people, signs in at
  # the bff through the dev IdP like a browser, and reads the floor, the fleet and the inbox while the engine runs.
  # Its networks are the ones those callers already use: data-record (Postgres, core, the bff), notary-api and
  # kms-clients (the seed's decisions), edge (the dev IdP, as a browser reaches it). It is a test client: it is not
  # started by `up`, and it holds the tokens of the callers it stands in for (the seed's and the bff's).
  load:
    <<: *factory
    profiles: [load]
    restart: 'no'
    command: ['node', '--enable-source-maps', '/app/services/core/dist/aisdlc-load.js', 'run']
    environment:
      FACTORY_ENV: local
      LOAD_DATABASE_URL: file:/run/secrets/db-url-aisdlc
      LOAD_NOTARY_URL: http://notary:8310
      LOAD_NOTARY_TOKEN_REF: file:/run/secrets/tok-core-notary
      KMS_URL: http://kms-local:8300
      KMS_TOKEN_REF: file:/run/secrets/tok-core-kms
      LOAD_CORE_URL: http://core:8380
      LOAD_CORE_TOKEN_REF: file:/run/secrets/tok-bff-core
      LOAD_BFF_URL: http://bff:8340
      LOAD_BFF_PUBLIC_URL: http://localhost:8340
      LOAD_OIDC_URL: http://dev-oidc.localhost:8390
      LOAD_OIDC_PUBLIC_URL: http://dev-oidc.localhost:8390
      LOAD_PROJECTS: ${LOAD_PROJECTS:-4}
      LOAD_ITEMS: ${LOAD_ITEMS:-30}
      LOAD_CODING_CAP: ${LOAD_CODING_CAP:-4}
      LOAD_CONCURRENCY: ${LOAD_CONCURRENCY:-8}
      LOAD_DEADLINE_S: ${LOAD_DEADLINE_S:-2400}
      LOAD_SAMPLE_MS: ${LOAD_SAMPLE_MS:-2000}
      LOAD_BURST: ${LOAD_BURST:-5}
    secrets: [db-url-aisdlc, tok-core-notary, tok-core-kms, tok-bff-core]
    depends_on:
      core: { condition: service_healthy }
      bff: { condition: service_healthy }
    networks: [data-record, notary-api, kms-clients, edge]
    mem_limit: 256m

  # ------------------------------------------------------------------------------- core

  # Projects, S0, cards, decisions: the record's writer. Verifies the bff's step-up proofs with the
  # public key from kms-local (it never signs). Cards need knowledge, the codehost reads and the
  # Notary together.
  core:
    <<: *factory
    command: ['node', '--enable-source-maps', '/app/services/core/dist/main.js']
    environment:
      # M19: OTLP/HTTP export to the collector (profile `telemetry`): set OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      CORE_DATABASE_URL: file:/run/secrets/db-url-aisdlc
      CORE_CALLERS: >-
        {"codehost":{"token_ref":"file:/run/secrets/tok-codehost-core","scopes":["registry","integrations"]},
        "identity":{"token_ref":"file:/run/secrets/tok-identity-core","scopes":["read"]},
        "operator":{"token_ref":"file:/run/secrets/tok-operator-core","scopes":["read","onboard","portal","ops"]},
        "push-broker":{"token_ref":"file:/run/secrets/tok-push-broker-core","scopes":["registry","push_guard"]},
        "bff":{"token_ref":"file:/run/secrets/tok-bff-core","scopes":["read","onboard","portal","work","ops","settings"]},
        "sandbox-controller":{"token_ref":"file:/run/secrets/tok-sandbox-controller-core","scopes":["activity"]},
        "audit":{"token_ref":"file:/run/secrets/tok-audit-core","scopes":["erasure"]}}
      CORE_NOTARY_URL: http://notary:8310
      CORE_NOTARY_TOKEN_REF: file:/run/secrets/tok-core-notary
      KMS_URL: http://kms-local:8300
      KMS_TOKEN_REF: file:/run/secrets/tok-core-kms
      CORE_KNOWLEDGE_URL: http://knowledge:8370
      CORE_KNOWLEDGE_TOKEN_REF: file:/run/secrets/tok-core-knowledge
      CORE_CODEHOST_URL: http://codehost:8350
      CORE_CODEHOST_TOKEN_REF: file:/run/secrets/tok-core-codehost
      # P2-4: the Push Broker's App report only (scope `status`), for the portal's GitHub Apps panel
      CORE_PUSH_BROKER_URL: http://push-broker:8350
      CORE_PUSH_BROKER_TOKEN_REF: file:/run/secrets/tok-core-push-broker
      # M14.6: the portal's Evidence Pack viewer reads the signed packs 7.6 stored (read only: core never writes there).
      CORE_OBJECT_STORE_URL: http://object-store:9000
      CORE_OBJECT_STORE_ACCESS_KEY_REF: file:/run/secrets/object-store-access-key
      CORE_OBJECT_STORE_SECRET_KEY_REF: file:/run/secrets/object-store-secret-key
      # M18: the onboarding assistant and "Ask the factory". The gateway's admin API (scopes admin, read: the person's
      # day budget group, a per-ask key with exactly the assistant contract's tools) and its /v1/messages under that
      # key; the knowledge token above carries `search` (the KnowledgeSearch tool). Local routes serve `fake-model`.
      # Reached per ask: while the gateway is down an ask is refused, nothing else in core waits for it.
      CORE_GATEWAY_URL: http://gateway:8410
      CORE_GATEWAY_TOKEN_REF: file:/run/secrets/tok-core-gateway
      CORE_ASSISTANT_EXTRA_MODELS: fake-model
      CORE_HOST: 0.0.0.0
      CORE_PORT: '8380'
      # M19: the floor's kill banner reads core-worker's read-only verdict (core is not on the kill switch's network)
      CORE_ADMISSION_URL: http://core-worker:8360
      # P1-6: identity's `grant` scope (core only): writes the role binding an approved access M1 decided
      CORE_IDENTITY_URL: http://identity:8330
      CORE_IDENTITY_TOKEN_REF: file:/run/secrets/tok-core-identity
    secrets:
      [
        db-url-aisdlc,
        tok-codehost-core,
        tok-identity-core,
        tok-operator-core,
        tok-bff-core,
        tok-core-notary,
        tok-core-kms,
        tok-core-knowledge,
        tok-core-codehost,
        tok-core-push-broker,
        tok-core-gateway,
        tok-core-identity,
        tok-sandbox-controller-core,
        tok-audit-core,
        tok-push-broker-core,
        object-store-access-key,
        object-store-secret-key,
      ]
    healthcheck:
      test: ['CMD', 'node', '/app/healthcheck.mjs', '8380']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 8s
    depends_on:
      migrate: { condition: service_completed_successfully }
      seed: { condition: service_completed_successfully }
      notary: { condition: service_healthy }
      kms-local: { condition: service_healthy }
      object-store: { condition: service_healthy }
    networks:
      [
        app,
        data-record,
        kms-clients,
        notary-api,
        objectstore-api,
        gateway-api,
        core-activity,
        telemetry,
        audit-core,
        pushbroker,
      ]
    mem_limit: 256m

  # The one process that hosts every loop (code-host polls, S0 driver, role-map sync, cards,
  # outbox watch). `/healthz` is 503 while any loop is down.
  core-worker:
    <<: *factory
    command: ['node', '--enable-source-maps', '/app/services/core-worker/dist/main.js']
    environment:
      # M19: OTLP/HTTP export to the collector (profile `telemetry`): set OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      CORE_WORKER_DATABASE_URL: file:/run/secrets/db-url-aisdlc
      CORE_WORKER_CODEHOST_URL: http://codehost:8350
      CORE_WORKER_CODEHOST_TOKEN_REF: file:/run/secrets/tok-core-worker-codehost
      CORE_WORKER_KNOWLEDGE_URL: http://knowledge:8370
      CORE_WORKER_KNOWLEDGE_TOKEN_REF: file:/run/secrets/tok-core-worker-knowledge
      CORE_WORKER_IDENTITY_URL: http://identity:8330
      CORE_WORKER_IDENTITY_TOKEN_REF: file:/run/secrets/tok-core-worker-identity
      CORE_WORKER_NOTARY_URL: http://notary:8310
      CORE_WORKER_NOTARY_TOKEN_REF: file:/run/secrets/tok-core-worker-notary
      # M8.0b: the checkpointer (Notary signs a tree head, the Witness co-signs it) and the reconciler.
      # 5 minutes by default; smoke.sh and e2e.sh set CHECKPOINT_INTERVAL_MS shorter.
      CORE_WORKER_WITNESS_URL: http://witness:8320
      CORE_WORKER_WITNESS_TOKEN_REF: file:/run/secrets/tok-core-worker-witness
      CORE_WORKER_CHECKPOINT_INTERVAL_MS: ${CHECKPOINT_INTERVAL_MS:-300000}
      # M9.6: the kill switch (AR9): admission reads it, the holders of every project are pushed to it,
      # its journal is recorded (and ledgered through the Notary). smoke.sh shortens the observer.
      CORE_WORKER_KILLSWITCH_URL: http://killswitch:8400
      CORE_WORKER_KILLSWITCH_TOKEN_REF: file:/run/secrets/tok-core-worker-killswitch
      CORE_WORKER_KILL_OBSERVER_INTERVAL_MS: ${KILL_OBSERVER_INTERVAL_MS:-5000}
      CORE_WORKER_KILL_HOLDERS_INTERVAL_MS: ${KILL_HOLDERS_INTERVAL_MS:-10000}
      # M12: the work driver with the real planning port (S1 to S5) and the model gateway, whose local fake
      # provider answers the planning steps with canned outputs (`fixtures: planning`). Off (`none`) unless the
      # run asks: e2e.sh sets `agents`; `fake` is the deterministic stage ports. The knowledge token above
      # carries the `search` scope (the KnowledgeSearch tool).
      CORE_WORKER_STAGE_PORTS: ${CORE_WORKER_STAGE_PORTS:-none}
      # M14.6: `exceptions` scripts S7's fakes to raise Q1, X2, E2 and E6 for the e2e (FACTORY_ENV=local only)
      CORE_WORKER_FAKE_VERIFY: ${CORE_WORKER_FAKE_VERIFY:-default}
      FACTORY_ENV: local
      CORE_WORKER_GATEWAY_URL: http://gateway:8410
      CORE_WORKER_GATEWAY_TOKEN_REF: file:/run/secrets/tok-core-worker-gateway
      CORE_WORKER_AGENT_EXTRA_MODELS: fake-model
      # M14.2: S6's sessions through the sandbox-controller (profile `sandbox`; it holds the coding proxy's token, the
      # class ceilings and the caps; H2 reads its free slots). Off unless the run sets it, with CORE_WORKER_STAGE_PORTS=agents.
      CORE_WORKER_SANDBOX_CONTROLLER_URL: ${CORE_WORKER_SANDBOX_CONTROLLER_URL:-}
      CORE_WORKER_SANDBOX_CONTROLLER_TOKEN_REF: file:/run/secrets/tok-core-worker-sandbox-controller
      # the S6 session store (a volume of its own) and the coder's model id at the gateway (local: the fake)
      CORE_WORKER_SESSION_STORE: /work/sessions
      CORE_WORKER_CODER_MODEL: ${CORE_WORKER_CODER_MODEL:-fake-model}
      # M13.6: 6.6 through the Push Broker (profile `push-broker`): its own codehost in push mode, its own App. Off unless
      # the run sets CORE_WORKER_PUSH_BROKER=1 (with the sandbox-controller); e2e-pr.sh does
      CORE_WORKER_PUSH_BROKER: ${CORE_WORKER_PUSH_BROKER:-}
      CORE_WORKER_PUSH_BROKER_URL: ${CORE_WORKER_PUSH_BROKER_URL:-}
      CORE_WORKER_PUSH_BROKER_TOKEN_REF: file:/run/secrets/tok-core-worker-push-broker
      # M14.3: S7 7.1 to 7.5 through the verify service (profile `sandbox`), and the 7.6 guard. Off unless the run sets
      # it, with CORE_WORKER_STAGE_PORTS=agents.
      CORE_WORKER_VERIFY_URL: ${CORE_WORKER_VERIFY_URL:-}
      CORE_WORKER_VERIFY_TOKEN_REF: file:/run/secrets/tok-core-worker-verify
      # M14.4: 7.6 signs the Evidence Pack through the Notary (scope `evidence`) and stores it in the object store's
      # write-once bucket `evidence-packs` (with a D2's Handoff Pack beside it); the store's credentials are file
      # references the S3 adapter resolves. Used only when CORE_WORKER_VERIFY_URL is set.
      CORE_WORKER_OBJECT_STORE_URL: http://object-store:9000
      CORE_WORKER_OBJECT_STORE_ACCESS_KEY_REF: file:/run/secrets/object-store-access-key
      CORE_WORKER_OBJECT_STORE_SECRET_KEY_REF: file:/run/secrets/object-store-secret-key
      KMS_URL: http://kms-local:8300
      KMS_TOKEN_REF: file:/run/secrets/tok-core-worker-kms
      # M19: HealthSnapshot. The services this worker can reach have their /healthz read every 30 s (with its own loops)
      # into the Operate › Health tiles. The profile services (`profile: true`: not answering reads unknown, never down
      # or ok, as a stack may not run them) are read over networks this worker already shares with them
      # (sandbox-controller-api, verify-api, kms-clients for gate-check, gate-relay and audit); the notifier, which only
      # the bff reaches, through the bff's relay (`/healthz/peer/notifier`): no network is added for health.
      CORE_WORKER_HEALTH_TARGETS: >-
        {"core":"http://core:8380","identity":"http://identity:8330","knowledge":"http://knowledge:8370",
        "codehost":"http://codehost:8350","notary":"http://notary:8310","witness":"http://witness:8320",
        "killswitch":"http://killswitch:8400","kms-local":"http://kms-local:8300","gateway":"http://gateway:8410",
        "bff":"http://bff:8340","object-store":{"url":"http://object-store:9000","path":"/minio/health/live"},
        "sandbox-controller":{"url":"http://sandbox-controller:8430","profile":true},
        "verify":{"url":"http://verify:8440","profile":true},
        "gate-check":{"url":"http://gate-check:8450","profile":true},
        "gate-relay":{"url":"http://gate-relay:8470","profile":true},
        "audit":{"url":"http://audit:8480","profile":true},
        "notifier":{"url":"http://bff:8340","path":"/healthz/peer/notifier","profile":true}}
      # M16: the issue twin (DEC-20(a)) through the codehost's tracker routes (scope `tracker`): the tracker's OWN App is
      # the codehost's to hold; core-worker holds no GitHub credential and has no route out (user decision 2026-11-12).
      # Empty TRACKER_LOGIN: the `issue_twin` loop does not run.
      CORE_WORKER_TRACKER_LOGIN: ${TRACKER_LOGIN:-}
      # M19: the work driver's poll (default 5000 ms); load.sh sets it to what the load run measures under
      CORE_WORKER_WORK_DRIVER_INTERVAL_MS: ${WORK_DRIVER_INTERVAL_MS:-5000}
      CORE_WORKER_HOST: 0.0.0.0
      CORE_WORKER_PORT: '8360'
    secrets:
      [
        db-url-aisdlc,
        tok-core-worker-codehost,
        tok-core-worker-knowledge,
        tok-core-worker-identity,
        tok-core-worker-notary,
        tok-core-worker-witness,
        tok-core-worker-killswitch,
        tok-core-worker-gateway,
        tok-core-worker-kms,
        tok-core-worker-sandbox-controller,
        tok-core-worker-verify,
        tok-core-worker-push-broker,
        object-store-access-key,
        object-store-secret-key,
      ]
    volumes:
      - core-worker-sessions:/work
    healthcheck:
      test: ['CMD', 'node', '/app/healthcheck.mjs', '8360']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    depends_on:
      migrate: { condition: service_completed_successfully }
      core: { condition: service_healthy }
      codehost: { condition: service_healthy }
      knowledge: { condition: service_healthy }
      identity: { condition: service_healthy }
      witness: { condition: service_healthy }
      killswitch: { condition: service_healthy }
      gateway: { condition: service_healthy }
    networks:
      [
        app,
        data-record,
        kms-clients,
        notary-api,
        witness-api,
        killswitch-api,
        gateway-api,
        sandbox-controller-api,
        verify-api,
        objectstore-api,
        telemetry,
        pushbroker,
      ]
    mem_limit: 512m

  # ------------------------------------------------------------------ code and repo content

  # Boundary: code-host credential custody (AR4, AR6, C24-CB). The only container with the GitHub
  # App key and the only one on the egress network. Reads only; hands knowledge credential-free
  # bundles. It has no database and no route to the trust plane.
  codehost:
    <<: *factory
    command: ['node', '--enable-source-maps', '/app/services/codehost/dist/main.js']
    environment:
      # M19: OTLP/HTTP export to the collector (profile `telemetry`): set OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      # The GitHub App is a row of the integration registry (`github-app`, seeded from the compose settings and
      # changed through an M1 gate), read from core and followed by config revision with no restart. The App
      # key stays in its own file (the reference is in the row); this deployment allows that one file and these
      # hosts (api.github.com and github.com; the fake profile adds its own loopback).
      CODEHOST_REGISTRY_INTEGRATION: github-app
      CODEHOST_SECRET_REFS: '["file:/run/secrets/github-app.pem"]'
      CODEHOST_EGRESS_HOSTS: '["api.github.com","github.com","127.0.0.1"]'
      CODEHOST_REGISTRY_INTERVAL_MS: ${CODEHOST_REGISTRY_INTERVAL_MS:-5000}
      CODEHOST_CALLERS: >-
        {"knowledge":{"token_ref":"file:/run/secrets/tok-knowledge-codehost","scopes":["census"]},
        "operator":{"token_ref":"file:/run/secrets/tok-operator-codehost","scopes":["reload"]},
        "core":{"token_ref":"file:/run/secrets/tok-core-codehost","scopes":["census","posture"]},
        "core-worker":{"token_ref":"file:/run/secrets/tok-core-worker-codehost","scopes":["census","posture","tracker"]},
        "verify":{"token_ref":"file:/run/secrets/tok-verify-codehost","scopes":["census"]}}
      CODEHOST_IDENTITY_URL: http://identity:8330
      CODEHOST_IDENTITY_TOKEN_REF: file:/run/secrets/tok-codehost-identity
      CODEHOST_CORE_URL: http://core:8380
      CODEHOST_CORE_TOKEN_REF: file:/run/secrets/tok-codehost-core
      TMPDIR: /work
      # M16: the issue twin's tracker, on its OWN App (issues: write, metadata read; never the read App's or the Push
      # Broker's key). Empty TRACKER_APP_ID: no tracker. The fake profile is on loopback, as the main App.
      CODEHOST_TRACKER_APP_ID: ${TRACKER_APP_ID:-}
      CODEHOST_TRACKER_INSTALLATION_ID: ${TRACKER_INSTALLATION_ID:-4}
      CODEHOST_TRACKER_APP_KEY_REF: file:/run/secrets/tracker-app.pem
      CODEHOST_TRACKER_LOGIN: ${TRACKER_LOGIN:-aisdlc-tracker[bot]}
      CODEHOST_TRACKER_API_URL: ${TRACKER_GITHUB_API_URL:-https://api.github.com}
      CODEHOST_HOST: 0.0.0.0
      CODEHOST_PORT: '8350'
    volumes:
      - codehost-work:/work
    secrets:
      [
        github-app.pem,
        tok-knowledge-codehost,
        tok-core-codehost,
        tok-core-worker-codehost,
        tok-operator-codehost,
        tok-codehost-identity,
        tok-codehost-core,
        tok-verify-codehost,
        tracker-app.pem,
      ]
    healthcheck:
      test: ['CMD', 'node', '/app/healthcheck.mjs', '8350']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks:
      [
        app,
        egress,
        verify-codehost,
        gatecheck-github,
        gaterelay-github,
        pushbroker-github,
        telemetry,
      ]
    mem_limit: 192m

  # Boundary: repo content (untrusted) vs credentials. Analyses bundles it gets from the codehost;
  # holds no code-host credential and no HMAC key (the fingerprint MAC is a call to kms-local); has
  # no route to GitHub. A secret scanner and census run here, not in core.
  knowledge:
    <<: *factory
    command: ['node', '--enable-source-maps', '/app/services/knowledge/dist/main.js']
    environment:
      # M19: OTLP/HTTP export to the collector (profile `telemetry`): set OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      KNOWLEDGE_DATABASE_URL: file:/run/secrets/db-url-aisdlc
      KNOWLEDGE_CALLERS: >-
        {"core":{"token_ref":"file:/run/secrets/tok-core-knowledge","scopes":["census","security","search"]},
        "core-worker":{"token_ref":"file:/run/secrets/tok-core-worker-knowledge","scopes":["census","security","search"]}}
      KNOWLEDGE_CODEHOST_URL: http://codehost:8350
      KNOWLEDGE_CODEHOST_TOKEN_REF: file:/run/secrets/tok-knowledge-codehost
      KNOWLEDGE_IDENTITY_URL: http://identity:8330
      KNOWLEDGE_IDENTITY_TOKEN_REF: file:/run/secrets/tok-knowledge-identity
      KMS_URL: http://kms-local:8300
      KMS_TOKEN_REF: file:/run/secrets/tok-knowledge-kms
      KNOWLEDGE_WORK_DIR: /work
      TMPDIR: /work
      KNOWLEDGE_HOST: 0.0.0.0
      KNOWLEDGE_PORT: '8370'
    volumes:
      - knowledge-work:/work
    secrets:
      [
        db-url-aisdlc,
        tok-core-knowledge,
        tok-core-worker-knowledge,
        tok-knowledge-codehost,
        tok-knowledge-identity,
        tok-knowledge-kms,
      ]
    healthcheck:
      test: ['CMD', 'node', '/app/healthcheck.mjs', '8370']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 8s
    depends_on:
      migrate: { condition: service_completed_successfully }
      kms-local: { condition: service_healthy }
      codehost: { condition: service_healthy }
    networks: [app, data-record, kms-clients, telemetry]
    mem_limit: 256m

  # Boundary: the factory's ONE writer (M13.6 Push Broker; ADR-0003 §1 Integration plane). The codehost image in
  # CODEHOST_MODE=push with its OWN GitHub App (contents and pull requests write; the read App's key is not here and this
  # one is in no other container): the Unit's patch as ONE commit on agent/<item>/<unit> (Git Data API, never a git push,
  # never a force) and a Draft PR, only after its own checks (the agent/** ref, the lease epoch core answers for, the
  # secret ruleset, the paths, X2 bound to the patch for a protected path, a fast-forward). It never merges, never marks
  # a PR ready and has no database. core-worker is its one caller (scope `push`).
  push-broker:
    <<: *factory
    profiles: [push-broker, full]
    command: ['node', '--enable-source-maps', '/app/services/codehost/dist/main.js']
    environment:
      CODEHOST_MODE: push
      CODEHOST_GITHUB_APP_ID: ${PUSH_BROKER_APP_ID:-987654}
      CODEHOST_GITHUB_INSTALLATION_ID: ${PUSH_BROKER_INSTALLATION_ID:-5}
      CODEHOST_GITHUB_APP_KEY_REF: file:/run/secrets/push-broker-app.pem
      CODEHOST_GITHUB_API_URL: ${PUSH_BROKER_GITHUB_API_URL:-}
      # the fake GitHub's door on `pushbroker-github` (the codehost's network namespace); nothing for GitHub itself
      CODEHOST_GITHUB_PLAIN_HTTP_HOSTS: '["codehost"]'
      CODEHOST_COMMITTER_NAME: ${PUSH_BROKER_LOGIN:-aisdlc[bot]}
      CODEHOST_CALLERS: >-
        {"core-worker":{"token_ref":"file:/run/secrets/tok-core-worker-push-broker","scopes":["push"]},
        "core":{"token_ref":"file:/run/secrets/tok-core-push-broker","scopes":["status"]}}
      CODEHOST_IDENTITY_URL: http://identity:8330
      CODEHOST_IDENTITY_TOKEN_REF: file:/run/secrets/tok-push-broker-identity
      CODEHOST_CORE_URL: http://core:8380
      CODEHOST_CORE_TOKEN_REF: file:/run/secrets/tok-push-broker-core
      TMPDIR: /tmp
      CODEHOST_HOST: 0.0.0.0
      CODEHOST_PORT: '8350'
    secrets:
      [
        push-broker-app.pem,
        tok-core-worker-push-broker,
        tok-core-push-broker,
        tok-push-broker-core,
        tok-push-broker-identity,
      ]
    healthcheck:
      test: ['CMD', 'node', '/app/healthcheck.mjs', '8350']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [pushbroker, pushbroker-github, pushbroker-egress]
    mem_limit: 160m

  # ----------------------------------------------------------------------- browser edge

  # Boundary: browser edge (AM-1, TR-5/TR-8): tokens never reach the browser; the session store and
  # the IdP client secret stay out of core. Signs step-up proofs through kms-local.
  bff:
    <<: *factory
    command: ['node', '--enable-source-maps', '/app/services/bff/dist/main.js']
    environment:
      # M19: OTLP/HTTP export to the collector (profile `telemetry`): set OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      BFF_DATABASE_URL: file:/run/secrets/db-url-aisdlc
      BFF_PUBLIC_URL: http://localhost:${AISDLC_BFF_PORT:-8340}
      BFF_OIDC_ISSUER: http://dev-oidc.localhost:${AISDLC_OIDC_PORT:-8390}
      BFF_OIDC_CLIENT_ID: aisdlc-bff
      BFF_OIDC_CLIENT_SECRET_REF: file:/run/secrets/bff-oidc-client-secret
      KMS_URL: http://kms-local:8300
      KMS_TOKEN_REF: file:/run/secrets/tok-bff-kms
      # The portal's API calls: core with the bff's own token (scopes read, onboard, portal, work), and the
      # web bundle the image carries, served same-origin with a strict CSP.
      BFF_CORE_URL: http://core:8380
      BFF_CORE_TOKEN_REF: file:/run/secrets/tok-bff-core
      # M18: the notifier (profile `notifier`), scope people. Best effort: while it is not running only the
      # /api/me/notifications routes answer 502; nothing else in the portal waits for it.
      BFF_NOTIFIER_URL: http://notifier:8460
      BFF_NOTIFIER_TOKEN_REF: file:/run/secrets/tok-bff-notifier
      BFF_WEB_DIR: /app/services/web/dist
      # M14.6: the S7 tab's gate-check runs (scope read). gate-check is in a profile: when it is not running the
      # portal shows the runs as unknown, never as passing.
      BFF_GATE_CHECK_URL: http://gate-check:8450
      BFF_GATE_CHECK_TOKEN_REF: file:/run/secrets/tok-bff-gate-check
      # 2026-11-12: the Sandboxes screen reads the controller's slots (scope read). The controller is in the
      # `sandbox` profile: when it is not running the screen says the slots are unknown.
      BFF_SANDBOX_CONTROLLER_URL: http://sandbox-controller:8430
      BFF_SANDBOX_CONTROLLER_TOKEN_REF: file:/run/secrets/tok-bff-sandbox-controller
      # M19: Govern › Audit (profile `audit`), scopes read, export, govern. While the audit service is not running only
      # the /api/audit/* routes answer 502; nothing else in the portal waits for it.
      BFF_AUDIT_URL: http://audit:8480
      BFF_AUDIT_TOKEN_REF: file:/run/secrets/tok-bff-audit
      # RC-UI-1: the kill switch (scopes act, read) for the portal's kill and release, each act carrying the person's
      # own step-up proof; and its list of kills for the Kill switch page.
      BFF_KILLSWITCH_URL: http://killswitch:8400
      BFF_KILLSWITCH_TOKEN_REF: file:/run/secrets/tok-bff-killswitch
      # M19: the notifier's liveness answer, relayed for core-worker's health tile (the bff is the one that reaches it)
      BFF_HEALTH_PEERS: '{"notifier":"http://notifier:8460"}'
      # Plain http on localhost only; behind TLS this is true.
      BFF_COOKIE_SECURE: 'false'
      BFF_HOST: 0.0.0.0
      BFF_PORT: '8340'
    ports:
      # M19: the HOST port can move (BFF_HOST_PORT). AISDLC_BFF_PORT moves it with the browser URL (BFF_PUBLIC_URL, the
      # redirect URI); inside, the bff listens on 8340 whatever it is
      - '127.0.0.1:${BFF_HOST_PORT:-${AISDLC_BFF_PORT:-8340}}:8340'
    secrets:
      [
        db-url-aisdlc,
        bff-oidc-client-secret,
        tok-bff-kms,
        tok-bff-core,
        tok-bff-gate-check,
        tok-bff-notifier,
        tok-bff-sandbox-controller,
        tok-bff-audit,
        tok-bff-killswitch,
      ]
    healthcheck:
      test: ['CMD', 'node', '/app/healthcheck.mjs', '8340']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 8s
    depends_on:
      migrate: { condition: service_completed_successfully }
      seed: { condition: service_completed_successfully }
      kms-local: { condition: service_healthy }
      dev-oidc: { condition: service_healthy }
      core: { condition: service_healthy }
    networks:
      [
        edge,
        data-record,
        kms-clients,
        gatecheck-api,
        notifier-api,
        sandbox-controller-api,
        telemetry-bff,
        audit-api,
        killswitch-bff,
      ]
    mem_limit: 256m

  # The dev identity provider (FACTORY_ENV=local only: it refuses to start otherwise). The browser
  # is redirected to it, so it is published too, and its issuer is a name both the browser and the
  # bff resolve: `dev-oidc.localhost` (a loopback name for the browser, a network alias for the bff).
  # With a real IdP (Entra) this service goes away and BFF_OIDC_* point at it.
  dev-oidc:
    <<: *factory
    command: ['node', '--enable-source-maps', '/app/services/bff/dist/dev-oidc.js']
    environment:
      FACTORY_ENV: local
      DEV_OIDC_USERS_FILE: /config/dev-oidc-users.json
      DEV_OIDC_CLIENT_ID: aisdlc-bff
      DEV_OIDC_CLIENT_SECRET_REF: file:/run/secrets/bff-oidc-client-secret
      DEV_OIDC_REDIRECT_URIS: http://localhost:${AISDLC_BFF_PORT:-8340}/auth/callback
      DEV_OIDC_ISSUER: http://dev-oidc.localhost:${AISDLC_OIDC_PORT:-8390}
      DEV_OIDC_HOST: 0.0.0.0
      DEV_OIDC_PORT: '${AISDLC_OIDC_PORT:-8390}'
    ports:
      - '127.0.0.1:${DEV_OIDC_HOST_PORT:-${AISDLC_OIDC_PORT:-8390}}:${AISDLC_OIDC_PORT:-8390}'
    volumes:
      - ./config/dev-oidc-users.json:/config/dev-oidc-users.json:ro
    secrets: [bff-oidc-client-secret]
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '/app/healthcheck.mjs',
          '${AISDLC_OIDC_PORT:-8390}',
          '/.well-known/openid-configuration',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks:
      edge:
        aliases: [dev-oidc.localhost]
    mem_limit: 128m

  # ------------------------------------------------------- the sandbox plane (a profile, PLAN M13.2)

  # THE ONLY CONTAINERS THAT MOUNT THE DOCKER SOCKET (smoke.sh checks it: exactly these two). Each is a small
  # allow-list HTTP proxy (services/docker-proxy): containers create/start/wait/logs/inspect/kill/delete of
  # sandboxes, and (coding instance only) the per-session internal networks. Never exec, build, image pull,
  # volumes, privileged, host namespaces, devices, added capabilities, or a bind mount other than the session's
  # read-only repo copy under the scratch root; never a container that is not labelled as a sandbox. `:ro` on a
  # socket mount does not limit API verbs: the proxy does. It runs as the factory uid with the socket's group
  # added (DOCKER_GID, `stat -c %g /var/run/docker.sock`; smoke.sh sets it). Needs `docker build -t
  # aisdlc/sandbox:local platform/sandbox` first (smoke.sh does it).
  docker-proxy-cvw:
    <<: *factory
    profiles: [sandbox, full]
    command: ['node', '--enable-source-maps', '/app/services/docker-proxy/dist/main.js']
    group_add: ['${DOCKER_GID:-0}']
    environment:
      DOCKER_PROXY_MODE: cvw
      # M19: this instance's owner label: it lists, inspects and removes only the sandboxes it labelled itself
      DOCKER_PROXY_OWNER: ${COMPOSE_PROJECT_NAME:-aisdlc}-cvw
      # the internal network is not an identity: every TCP caller presents its own bearer token (file: references)
      DOCKER_PROXY_CALLERS: cvw=file:/run/secrets/tok-cvw-docker-cvw
      DOCKER_PROXY_IMAGES: ${SANDBOX_IMAGE:-aisdlc/sandbox:local},${SANDBOX_AGENT_IMAGE:-aisdlc/sandbox-agent:local}
      DOCKER_PROXY_SCRATCH_ROOT: ${SANDBOX_SCRATCH:-/var/lib/aisdlc/sandbox-scratch}
      DOCKER_PROXY_HOST: 0.0.0.0
      DOCKER_PROXY_PORT: '2375'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ['CMD', 'node', '/app/healthcheck.mjs', '2375']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 3s
    secrets: [tok-cvw-docker-cvw]
    networks: [docker-cvw]
    # M19: 96m: the proxy (about 50 MiB at start) and its node healthcheck share one cgroup; 64m OOM-killed it
    mem_limit: 96m

  # The wider instance, for the coding worker: the same list plus the per-session internal networks and the
  # attach of the gateway and the mirror to them. Still no exec, no build, no pull, no volume, one coding
  # session at a time (also counted here, from the daemon).
  docker-proxy-coding:
    <<: *factory
    profiles: [sandbox, full]
    command: ['node', '--enable-source-maps', '/app/services/docker-proxy/dist/main.js']
    group_add: ['${DOCKER_GID:-0}']
    environment:
      DOCKER_PROXY_MODE: coding
      # M19: this runner host's owner label: the sandbox-controller's sweep (at boot, after a crash) removes only these
      DOCKER_PROXY_OWNER: ${COMPOSE_PROJECT_NAME:-aisdlc}-coding
      # M14.2: the sandbox-controller is the one service that drives it (core-worker no longer holds a token here)
      DOCKER_PROXY_CALLERS: sandbox-controller=file:/run/secrets/tok-sandbox-controller-docker-coding,smoke=file:/run/secrets/tok-smoke-docker-coding
      # M16: plus the onboarding probe image by digest (platform/sandbox/onboarding/build.sh prints it), when built
      DOCKER_PROXY_IMAGES: ${SANDBOX_IMAGE:-aisdlc/sandbox:local},${SANDBOX_AGENT_IMAGE:-aisdlc/sandbox-agent:local},${SANDBOX_ONBOARDING_IMAGE:-}
      DOCKER_PROXY_SCRATCH_ROOT: ${SANDBOX_SCRATCH:-/var/lib/aisdlc/sandbox-scratch}
      DOCKER_PROXY_MAX_SANDBOXES: '4'
      DOCKER_PROXY_CODING_CAP: '1'
      DOCKER_PROXY_HOST: 0.0.0.0
      DOCKER_PROXY_PORT: '2375'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ['CMD', 'node', '/app/healthcheck.mjs', '2375']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 3s
    secrets: [tok-sandbox-controller-docker-coding, tok-smoke-docker-coding]
    networks: [docker-coding]
    mem_limit: 96m

  # The sandbox-controller (M14.2; ADR-0003 §6 "Placement", §7 caps): the one client of the coding proxy. It owns the
  # sandbox driver, the class ceilings and the two caps of this runner host (`sandbox.caps`, M1-gated config: a total,
  # default 4, and a coding (W) cap, default 1), starts only a session whose admission grant core recorded as active
  # (it reads `core.admission_grant`), never queues (over a cap it answers `busy` and core's admission waits), and
  # reports the free slots H2 reads. Its state is the running sessions, in memory: disposable. It holds the coding
  # proxy's token and the gateway virtual key of a running session (passed through, never stored), and no other secret.
  # The scratch directory is mounted at the SAME path the daemon sees (a session's read-only repo copy is a bind of it).
  sandbox-controller:
    <<: *factory
    profiles: [sandbox, full]
    command: ['node', '--enable-source-maps', '/app/services/sandbox-controller/dist/main.js']
    environment:
      # M19: OTLP/HTTP export to the collector (profile `telemetry`) on its own network `telemetry-sandbox-controller`
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      # its own least-privilege role (db-init.sh; the config and core migrations grant it three relations: the
      # effective config, `core.admission_grant` and, M16, the probe grants `core.probe_grant`)
      SANDBOX_CONTROLLER_DATABASE_URL: file:/run/secrets/db-url-sandbox-controller
      SANDBOX_CONTROLLER_CALLERS: >-
        {"core-worker":{"token_ref":"file:/run/secrets/tok-core-worker-sandbox-controller","scopes":["run","read"]},
        "operator":{"token_ref":"file:/run/secrets/tok-operator-sandbox-controller","scopes":["read","admin"]},
        "verify":{"token_ref":"file:/run/secrets/tok-verify-sandbox-controller","scopes":["run"]},
        "bff":{"token_ref":"file:/run/secrets/tok-bff-sandbox-controller","scopes":["read"]}}
      SANDBOX_CONTROLLER_HOST_ID: local
      SANDBOX_CONTROLLER_PROXY_URL: http://docker-proxy-coding:2375
      SANDBOX_CONTROLLER_PROXY_TOKEN_REF: file:/run/secrets/tok-sandbox-controller-docker-coding
      SANDBOX_CONTROLLER_IMAGE: ${SANDBOX_AGENT_IMAGE:-aisdlc/sandbox-agent:local}
      # M16 part 3 (LF4): the image id (sha256:...) of that W image (`docker image inspect --format '{{.Id}}'`). A W
      # session starts only when it is the M1-approved `onboarding.light_tests.worker_image` (the image SP-STD-1 was
      # recorded for) and the daemon made the container from it; empty: no W session runs
      SANDBOX_CONTROLLER_WORKER_IMAGE_ID: ${SANDBOX_AGENT_IMAGE_ID:-}
      # M16: the onboarding probe image (a digest) the driver may run; a K-exec session must ALSO name the image the
      # M1-approved config `onboarding.sandbox_image` names, under a probe grant core recorded (`core.probe_grant`)
      SANDBOX_CONTROLLER_PROBE_IMAGES: ${SANDBOX_ONBOARDING_IMAGE:-}
      SANDBOX_CONTROLLER_SCRATCH: ${SANDBOX_SCRATCH:-/var/lib/aisdlc/sandbox-scratch}
      SANDBOX_CONTROLLER_MIRROR: ${COMPOSE_PROJECT_NAME:-aisdlc}-package-mirror
      SANDBOX_CONTROLLER_GATEWAY: ${COMPOSE_PROJECT_NAME:-aisdlc}-gateway
      # M19: the heartbeat of every running session to core (scope `activity` only), so a busy quiet session is not stuck
      SANDBOX_CONTROLLER_CORE_URL: http://core:8380
      SANDBOX_CONTROLLER_CORE_TOKEN_REF: file:/run/secrets/tok-sandbox-controller-core
      SANDBOX_CONTROLLER_HOST: 0.0.0.0
      SANDBOX_CONTROLLER_PORT: '8430'
    volumes:
      - ${SANDBOX_SCRATCH:-/var/lib/aisdlc/sandbox-scratch}:${SANDBOX_SCRATCH:-/var/lib/aisdlc/sandbox-scratch}
    secrets:
      [
        db-url-sandbox-controller,
        tok-sandbox-controller-docker-coding,
        tok-core-worker-sandbox-controller,
        tok-operator-sandbox-controller,
        tok-verify-sandbox-controller,
        tok-bff-sandbox-controller,
        tok-sandbox-controller-core,
      ]
    healthcheck:
      test: ['CMD', 'node', '/app/healthcheck.mjs', '8430']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    depends_on:
      migrate: { condition: service_completed_successfully }
      docker-proxy-coding: { condition: service_healthy }
    networks:
      [
        data-sandbox-controller,
        sandbox-controller-api,
        docker-coding,
        core-activity,
        telemetry-sandbox-controller,
      ]
    mem_limit: 512m

  # The verify service (M14.3; ADR-0003 §1 Control plane, the plan's `cvw`): S7's checks 7.1 to 7.5 over a Unit head.
  # It holds no vendor key, no code-host credential and no Docker right: the repo comes from the codehost's bundle
  # route, every kit (the repo's commands, the stub probe, the mutants, the holdouts, in class O: no key, the mirror
  # only) is a session the sandbox-controller places under the item's admission grant, and the A5 reviewer of 7.3 and
  # 7.5 is one gateway call under the run's own key, lent for that call. Each result is a record event on its own
  # `verify:` stream before it is answered. Its own database role (db-init.sh, the verify migration).
  verify:
    <<: *factory
    profiles: [sandbox, full]
    command: ['node', '--enable-source-maps', '/app/services/verify/dist/main.js']
    environment:
      # M19: OTLP/HTTP export to the collector (profile `telemetry`) on its own network `telemetry-verify`
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      VERIFY_DATABASE_URL: file:/run/secrets/db-url-verify
      VERIFY_CALLERS: >-
        {"core-worker":{"token_ref":"file:/run/secrets/tok-core-worker-verify","scopes":["run","read"]}}
      VERIFY_SANDBOX_CONTROLLER_URL: http://sandbox-controller:8430
      VERIFY_SANDBOX_CONTROLLER_TOKEN_REF: file:/run/secrets/tok-verify-sandbox-controller
      VERIFY_CODEHOST_URL: http://codehost:8350
      VERIFY_CODEHOST_TOKEN_REF: file:/run/secrets/tok-verify-codehost
      VERIFY_GATEWAY_URL: http://gateway:8410
      TMPDIR: /tmp
      VERIFY_HOST: 0.0.0.0
      VERIFY_PORT: '8440'
    secrets:
      [db-url-verify, tok-core-worker-verify, tok-verify-sandbox-controller, tok-verify-codehost]
    healthcheck:
      test: ['CMD', 'node', '/app/healthcheck.mjs', '8440']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    depends_on:
      migrate: { condition: service_completed_successfully }
      sandbox-controller: { condition: service_healthy }
      codehost: { condition: service_healthy }
      gateway: { condition: service_healthy }
    networks:
      [
        data-verify,
        verify-api,
        verify-codehost,
        sandbox-controller-api,
        gateway-api,
        telemetry-verify,
      ]
    mem_limit: 256m

  # gate-check (M14.5; ADR-0003 §1 Integration plane, AR9 gate plane): the check run `aisdlc/gate` on every PR of a
  # registered repo, through its OWN GitHub App (`checks: write`, pull requests read; the key is in no other container,
  # and the codehost's key is not here). It passes an agent PR only when the Evidence Pack signed for exactly the PR
  # head verifies with the Notary's public key (a public-key read from kms-local: it may use no key) and G3 is approved
  # in the ledger; it never passes a person's or an S0 PR, and records every merge (a bypass or unauthorised one gets
  # core's X4 review from the record). It never merges. It has no route to core: it reads the record database as its
  # own role and the packs from the object store; nothing of core's API is on its networks.
  gate-check:
    <<: *factory
    profiles: [gate-check, full]
    command: ['node', '--enable-source-maps', '/app/services/gate-check/dist/main.js']
    environment:
      # M19: OTLP/HTTP export to the collector (profile `telemetry`) on its own network `telemetry-gate-check`
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      GATE_CHECK_DATABASE_URL: file:/run/secrets/db-url-gate-check
      GATE_CHECK_CALLERS: >-
        {"operator":{"token_ref":"file:/run/secrets/tok-operator-gate-check","scopes":["read"]},
        "bff":{"token_ref":"file:/run/secrets/tok-bff-gate-check","scopes":["read"]}}
      GATE_CHECK_APP_ID: ${GATE_CHECK_APP_ID:-654321}
      GATE_CHECK_INSTALLATION_ID: ${GATE_CHECK_INSTALLATION_ID:-2}
      GATE_CHECK_APP_KEY_REF: file:/run/secrets/gate-check-app.pem
      GATE_CHECK_GITHUB_API_URL: ${GATE_CHECK_GITHUB_API_URL:-https://api.github.com}
      GATE_CHECK_GITHUB_PLAIN_HTTP_HOSTS: '["codehost"]'
      # the Push Broker App's bot login: who authors agent PRs (the fake host's is aisdlc[bot])
      GATE_CHECK_PUSH_BROKER_LOGIN: ${GATE_CHECK_PUSH_BROKER_LOGIN:-aisdlc[bot]}
      GATE_CHECK_OBJECT_STORE_URL: http://object-store:9000
      GATE_CHECK_OBJECT_STORE_ACCESS_KEY_REF: file:/run/secrets/object-store-access-key
      GATE_CHECK_OBJECT_STORE_SECRET_KEY_REF: file:/run/secrets/object-store-secret-key
      KMS_URL: http://kms-local:8300
      KMS_TOKEN_REF: file:/run/secrets/tok-gate-check-kms
      GATE_CHECK_HOST: 0.0.0.0
      GATE_CHECK_PORT: '8450'
    secrets:
      [
        db-url-gate-check,
        gate-check-app.pem,
        tok-gate-check-kms,
        tok-operator-gate-check,
        tok-bff-gate-check,
        object-store-access-key,
        object-store-secret-key,
      ]
    healthcheck:
      test: ['CMD', 'node', '/app/healthcheck.mjs', '8450']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    depends_on:
      migrate: { condition: service_completed_successfully }
      kms-local: { condition: service_healthy }
      object-store: { condition: service_healthy }
    networks:
      [
        data-gatecheck,
        kms-clients,
        objectstore-api,
        gatecheck-github,
        gatecheck-egress,
        gatecheck-api,
        telemetry-gate-check,
      ]
    mem_limit: 192m

  # gate-relay (M15.3; ADR-0003 §1 Integration plane, AR9 gate plane): G5 release. An approved G5 whose card binds the
  # merged commit to the Evidence Pack's head is consumed exactly once into a deployment of that commit, through its
  # OWN GitHub App (`deployments: write`, metadata read; the key is in no other container). It checks the binding
  # again itself (gate-check's record of the gated merge, the pack verified with the Notary's public key: a public-key
  # read from kms-local, it may use no key) and rolls an unhealthy release back (B16). It never merges or writes a
  # status. It has no route to core: it reads the record database as its own role; nothing of core's API is on its
  # networks.
  gate-relay:
    <<: *factory
    profiles: [gate-relay]
    command: ['node', '--enable-source-maps', '/app/services/gate-relay/dist/main.js']
    environment:
      # M19: OTLP/HTTP export to the collector (profile `telemetry`) on its own network `telemetry-gate-relay`
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      GATE_RELAY_DATABASE_URL: file:/run/secrets/db-url-gate-relay
      GATE_RELAY_CALLERS: >-
        {"operator":{"token_ref":"file:/run/secrets/tok-operator-gate-relay","scopes":["read"]}}
      GATE_RELAY_APP_ID: ${GATE_RELAY_APP_ID:-765432}
      GATE_RELAY_INSTALLATION_ID: ${GATE_RELAY_INSTALLATION_ID:-3}
      GATE_RELAY_APP_KEY_REF: file:/run/secrets/gate-relay-app.pem
      GATE_RELAY_GITHUB_API_URL: ${GATE_RELAY_GITHUB_API_URL:-https://api.github.com}
      GATE_RELAY_GITHUB_PLAIN_HTTP_HOSTS: '["codehost"]'
      GATE_RELAY_OBJECT_STORE_URL: http://object-store:9000
      GATE_RELAY_OBJECT_STORE_ACCESS_KEY_REF: file:/run/secrets/object-store-access-key
      GATE_RELAY_OBJECT_STORE_SECRET_KEY_REF: file:/run/secrets/object-store-secret-key
      KMS_URL: http://kms-local:8300
      KMS_TOKEN_REF: file:/run/secrets/tok-gate-relay-kms
      GATE_RELAY_HOST: 0.0.0.0
      GATE_RELAY_PORT: '8470'
    secrets:
      [
        db-url-gate-relay,
        gate-relay-app.pem,
        tok-gate-relay-kms,
        tok-operator-gate-relay,
        object-store-access-key,
        object-store-secret-key,
      ]
    healthcheck:
      test: ['CMD', 'node', '/app/healthcheck.mjs', '8470']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    depends_on:
      migrate: { condition: service_completed_successfully }
      kms-local: { condition: service_healthy }
      object-store: { condition: service_healthy }
    networks:
      [
        data-gaterelay,
        kms-clients,
        objectstore-api,
        gaterelay-github,
        gaterelay-egress,
        telemetry-gate-relay,
      ]
    mem_limit: 192m

  # The notifier (M18; ADR-0003 §1 Integration plane): Slack (incoming webhook) and email (SMTP) delivery of what waits
  # for a person (a gate on their slot, B21, a quarantine, a handoff, a kill), read from the record as its own
  # least-privilege role. The portal inbox stays the authoritative channel: the notifier decides nothing, and a channel
  # that is down only delays its own deliveries (retries with backoff, then given up). Its channel rows are config
  # (`notifications.channels`, M1-gated, empty by default: no channel until a factory revision adds one); the key files
  # a row may name and the hosts it may reach are bounded here, by the deployment. Mount a webhook URL or an SMTP
  # password as a secret and list its path in NOTIFIER_SECRET_REFS; nothing is mounted by default.
  notifier:
    <<: *factory
    profiles: [notifier]
    command: ['node', '--enable-source-maps', '/app/services/notifier/dist/main.js']
    environment:
      # M19: OTLP/HTTP export to the collector (profile `telemetry`) on its own network `telemetry-notifier`
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      NOTIFIER_DATABASE_URL: file:/run/secrets/db-url-notifier
      NOTIFIER_CALLERS: >-
        {"bff":{"token_ref":"file:/run/secrets/tok-bff-notifier","scopes":["people"]}}
      NOTIFIER_PORTAL_URL: ${NOTIFIER_PORTAL_URL:-http://localhost:${AISDLC_BFF_PORT:-8340}}
      NOTIFIER_SECRET_REFS: ${NOTIFIER_SECRET_REFS:-[]}
      NOTIFIER_EGRESS_HOSTS: ${NOTIFIER_EGRESS_HOSTS:-["hooks.slack.com"]}
      NOTIFIER_HOST: 0.0.0.0
      NOTIFIER_PORT: '8460'
    secrets: [db-url-notifier, tok-bff-notifier]
    healthcheck:
      test: ['CMD', 'node', '/app/healthcheck.mjs', '8460']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [data-notifier, notifier-api, notifier-egress, telemetry-notifier]
    mem_limit: 160m

  # The audit service (M19; ADR-0003 §1 Trust plane "audit", one service): signed exports of the ledger and the record
  # of a project or the fleet into the write-once bucket `audit-exports` (Object Lock), each signed by the Notary under
  # its export purpose and checked offline before it is stored, with an `audit.export` ledger entry; legal holds and
  # erasure of the payloads kept off the hash chain (two factory admins, `legal_hold.*` and `erasure.execute` on the
  # ledger, a hold always wins); retention from `audit.retention` (M1-gated, keeps everything by default). It holds no
  # key (the Notary signs, kms-local only answers its public-key reads), reads the record database as its own role and
  # reaches core only for the erasable payloads (scope `erasure`, on `audit-core`).
  audit:
    <<: *factory
    profiles: [audit]
    command: ['node', '--enable-source-maps', '/app/services/audit/dist/main.js']
    environment:
      # M19: OTLP/HTTP export to the collector (profile `telemetry`) on its own network `telemetry-audit`
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      AUDIT_DATABASE_URL: file:/run/secrets/db-url-audit
      AUDIT_CALLERS: >-
        {"bff":{"token_ref":"file:/run/secrets/tok-bff-audit","scopes":["read","export","govern"]}}
      AUDIT_NOTARY_URL: http://notary:8310
      AUDIT_NOTARY_TOKEN_REF: file:/run/secrets/tok-audit-notary
      KMS_URL: http://kms-local:8300
      KMS_TOKEN_REF: file:/run/secrets/tok-audit-kms
      AUDIT_CORE_URL: http://core:8380
      AUDIT_CORE_TOKEN_REF: file:/run/secrets/tok-audit-core
      AUDIT_OBJECT_STORE_URL: http://object-store:9000
      AUDIT_OBJECT_STORE_ACCESS_KEY_REF: file:/run/secrets/object-store-access-key
      AUDIT_OBJECT_STORE_SECRET_KEY_REF: file:/run/secrets/object-store-secret-key
      AUDIT_HOST: 0.0.0.0
      AUDIT_PORT: '8480'
    secrets:
      [
        db-url-audit,
        tok-bff-audit,
        tok-audit-notary,
        tok-audit-kms,
        tok-audit-core,
        object-store-access-key,
        object-store-secret-key,
      ]
    healthcheck:
      test: ['CMD', 'node', '/app/healthcheck.mjs', '8480']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    depends_on:
      migrate: { condition: service_completed_successfully }
      kms-local: { condition: service_healthy }
      notary: { condition: service_healthy }
      object-store: { condition: service_healthy }
    networks:
      [data-audit, audit-api, audit-core, notary-api, kms-clients, objectstore-api, telemetry-audit]
    mem_limit: 192m

  # The package mirror (RV §2: with the gateway, the ONLY thing a sandbox reaches): a read-only HTTP server over
  # a fixed directory, on an internal network, no upstream. The fixture set is empty until the real wheels are
  # chosen (DEC-17), so a package manager pointed at it fails closed. A sandbox network peer, by label and name.
  package-mirror:
    <<: *factory
    profiles: [sandbox, full]
    container_name: ${COMPOSE_PROJECT_NAME:-aisdlc}-package-mirror
    labels:
      aisdlc.sandbox.peer: mirror
    command: ['node', '--enable-source-maps', '/app/services/package-mirror/dist/main.js']
    environment:
      PACKAGE_MIRROR_ROOT: /fixtures
      PACKAGE_MIRROR_HOST: 0.0.0.0
      PACKAGE_MIRROR_PORT: '8420'
    volumes:
      - ../../services/package-mirror/fixtures:/fixtures:ro
    healthcheck:
      test: ['CMD', 'node', '/app/healthcheck.mjs', '8420']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 3s
    networks: [sandbox-mirror]
    mem_limit: 64m

  # smoke.sh's client (profile `sandbox-smoke`, run with `docker compose run`): starts one K session and one
  # K-exec through the coding proxy and asks it for what a compromised worker would. The scratch directory is
  # mounted at the SAME path the daemon sees (the sandbox's read-only repo copy is a bind of it).
  sandbox-smoke:
    <<: *factory
    profiles: [sandbox-smoke]
    restart: 'no'
    command: ['node', '--enable-source-maps', '/app/services/sandbox-driver/dist/smoke.js']
    environment:
      SANDBOX_PROXY: http://docker-proxy-coding:2375
      SANDBOX_PROXY_TOKEN_REF: file:/run/secrets/tok-smoke-docker-coding
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-aisdlc/sandbox:local}
      SANDBOX_AGENT_IMAGE: ${SANDBOX_AGENT_IMAGE:-aisdlc/sandbox-agent:local}
      SANDBOX_SCRATCH: ${SANDBOX_SCRATCH:-/var/lib/aisdlc/sandbox-scratch}
      SANDBOX_MIRROR: ${COMPOSE_PROJECT_NAME:-aisdlc}-package-mirror
      SANDBOX_GATEWAY: ${COMPOSE_PROJECT_NAME:-aisdlc}-gateway
    volumes:
      - ${SANDBOX_SCRATCH:-/var/lib/aisdlc/sandbox-scratch}:${SANDBOX_SCRATCH:-/var/lib/aisdlc/sandbox-scratch}
    secrets: [tok-smoke-docker-coding]
    networks: [docker-coding]
    mem_limit: 128m

  # ------------------------------------------------------------------- the object store (M14.1)

  # S3-compatible object store for large content (ADR-0003 §2): Evidence Packs from M14.4. MinIO here, any S3
  # service in the cloud (the adapter is `S3ObjectStore`, packages/ports). The adapter creates and checks the
  # buckets itself (`declareBucket`; a write-once bucket is created with Object Lock), so there is no init job.
  # Root credentials are the two secret files, read through MinIO's `_FILE` variables. Image: Chainguard's
  # build of MinIO, pinned by digest (the upstream minio/minio images are no longer published to Docker Hub).
  # Its only tools are coreutils and bash, so the healthcheck is a bash /dev/tcp probe of /minio/health/live.
  # Not a dependency of any service yet.
  object-store:
    image: chainguard/minio@sha256:db3f583fa49121942168bd6383a773b2cde3384c9a99bf7193560b9a0f3a28fd
    user: '${AISDLC_UID:?run ./init-secrets first}:${AISDLC_GID:?run ./init-secrets first}'
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64m
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }
    command: ['server', '/data', '--address', ':9000', '--quiet']
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/object-store-access-key
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/object-store-secret-key
      MINIO_BROWSER: 'off'
      HOME: /tmp
    volumes:
      - objectstore-data:/data
    secrets: [object-store-access-key, object-store-secret-key]
    healthcheck:
      test:
        - CMD
        - /usr/bin/bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/9000 && printf "GET /minio/health/live HTTP/1.1\r\nHost: 127.0.0.1\r\nConnection: close\r\n\r\n" >&3 && read -r l <&3 && [[ "$$l" == *" 200 "* ]]'
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    networks: [objectstore-api]
    mem_limit: 512m

  # The OpenTelemetry collector (PLAN M19; ADR-0003 §2 Telemetry: one collector for metrics, logs and traces), profile
  # `telemetry`. Turned on with `--profile telemetry` and OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318, which
  # the services that join its networks export their content-free server spans and request histograms to
  # (packages/service-kit/src/telemetry.ts). It holds no secret, publishes no port, has no route out (locally it only
  # prints counts, `debug`), and nothing depends on it: while it is down, telemetry is lost and work is not. Image: the
  # upstream core distribution, pinned by digest; it runs as its own non-root user with a read-only root and no
  # capabilities. Its image has no shell, so it has no healthcheck.
  otel-collector:
    image: otel/opentelemetry-collector:0.138.0@sha256:56951db9579bf00d3f32a4e934e19548183a86c14640798502bcd4c225976ea6
    profiles: [telemetry]
    command: ['--config=/etc/otelcol/config.yaml']
    user: '10001:10001'
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    volumes:
      - ./config/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }
    networks:
      [
        telemetry,
        telemetry-bff,
        telemetry-notary,
        telemetry-witness,
        telemetry-killswitch,
        telemetry-kms-local,
        telemetry-gateway,
        telemetry-sandbox-controller,
        telemetry-verify,
        telemetry-gate-check,
        telemetry-gate-relay,
        telemetry-notifier,
        telemetry-audit,
      ]
    mem_limit: 128m
    pids_limit: 128

  # ------------------------------------------------------------- the fake GitHub (a profile)

  # Not a service of the factory: the other end of the codehost's egress. The in-repo fake GitHub
  # REST server and a git server over one seeded repository (reshif/asf-factory-testbed), in the
  # codehost's own network namespace because the codehost accepts plain http to loopback only (it
  # carries credentials). It prints every request it gets; the live-exit evidence that the factory
  # only reads is `docker compose logs fake-github`.
  fake-github:
    <<: *factory
    profiles: [fake-github]
    network_mode: 'service:codehost'
    command: ['node', '--enable-source-maps', '/app/services/codehost/dist/fake-github.js']
    environment:
      FAKE_GITHUB_APP_ID: ${GITHUB_APP_ID:?run ./init-secrets first}
      FAKE_GITHUB_INSTALLATION_ID: ${GITHUB_INSTALLATION_ID:?run ./init-secrets first}
      FAKE_GITHUB_APP_PUBLIC_KEY_FILE: /run/secrets/github-app.pub.pem
      FAKE_GITHUB_API_PORT: '8353'
      FAKE_GITHUB_GIT_PORT: '8354'
      FAKE_GITHUB_DIR: /tmp/fake-github
      # gate-check's own App on the same fake host (M14.5): its key, its installation, its door on 0.0.0.0:8355
      FAKE_GITHUB_CHECKS_APP_ID: ${GATE_CHECK_APP_ID:-654321}
      FAKE_GITHUB_CHECKS_INSTALLATION_ID: ${GATE_CHECK_INSTALLATION_ID:-2}
      FAKE_GITHUB_CHECKS_APP_PUBLIC_KEY_FILE: /run/secrets/gate-check-app.pub.pem
      FAKE_GITHUB_GATE_CHECK_PORT: '8355'
      # gate-relay's own App on the same fake host (M15.3): its key, its installation, its door on 0.0.0.0:8356
      FAKE_GITHUB_DEPLOY_APP_ID: ${GATE_RELAY_APP_ID:-765432}
      FAKE_GITHUB_DEPLOY_INSTALLATION_ID: ${GATE_RELAY_INSTALLATION_ID:-3}
      FAKE_GITHUB_DEPLOY_APP_PUBLIC_KEY_FILE: /run/secrets/gate-relay-app.pub.pem
      FAKE_GITHUB_GATE_RELAY_PORT: '8356'
      # the issue twin's tracker App on the same fake host (M16): its key and installation; the codehost reaches it on
      # loopback, as the main App (core-worker never does)
      FAKE_GITHUB_TRACKER_APP_ID: ${TRACKER_APP_ID:-876543}
      FAKE_GITHUB_TRACKER_INSTALLATION_ID: ${TRACKER_INSTALLATION_ID:-4}
      FAKE_GITHUB_TRACKER_APP_PUBLIC_KEY_FILE: /run/secrets/tracker-app.pub.pem
      FAKE_GITHUB_TRACKER_LOGIN: ${TRACKER_LOGIN:-aisdlc-tracker[bot]}
      # the Push Broker's own App on the same fake host: its key, its installation (contents and pull requests write),
      # its door on 0.0.0.0:8358 (`pushbroker-github`); what it writes is mirrored into the git server's repository
      FAKE_GITHUB_PUSH_APP_ID: ${PUSH_BROKER_APP_ID:-987654}
      FAKE_GITHUB_PUSH_INSTALLATION_ID: ${PUSH_BROKER_INSTALLATION_ID:-5}
      FAKE_GITHUB_PUSH_APP_PUBLIC_KEY_FILE: /run/secrets/push-broker-app.pub.pem
      FAKE_GITHUB_PUSH_BROKER_PORT: '8358'
      # the bot the Push Broker's PRs are authored by (setup-github-apps: the factory App's `<slug>[bot]`)
      FAKE_GITHUB_BOT_LOGIN: ${PUSH_BROKER_LOGIN:-aisdlc[bot]}
      # the people who may merge on the fake host (the repo's owner; e2e-pr.mjs merges as them), and the branch rule
      # their merge needs: gate-check's `aisdlc/gate` passing on the head
      FAKE_GITHUB_PEOPLE: ${FAKE_GITHUB_PEOPLE:-reshif}
      FAKE_GITHUB_REQUIRED_CHECKS: aisdlc/gate
    secrets:
      [
        github-app.pub.pem,
        gate-check-app.pub.pem,
        gate-relay-app.pub.pem,
        tracker-app.pub.pem,
        push-broker-app.pub.pem,
      ]
    healthcheck:
      test: ['CMD', 'node', '/app/healthcheck.mjs', '8353']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    depends_on:
      codehost: { condition: service_started }
    mem_limit: 128m
