# Local-prod stack (PLAN M8.0). One command from a clean checkout:
#
#   ./init-secrets && docker compose --profile fake-github up -d --wait
#
# Read README.md first: it says why each container is a container (RV §2: a key, a Docker or socket
# right, egress, AR9 independence, or an untrusted origin; everything else would be a module of core
# or a loop of core-worker), what local-prod stubs against the cloud target, and how to point the
# stack at a real GitHub App.
#
# Ports: every service has its own (postgres 5432, kms-local 8300, notary 8310, witness 8320,
# identity 8330, bff 8340, codehost 8350, core-worker 8360, knowledge 8370, core 8380, dev-oidc 8390,
# killswitch 8400, gateway 8410, package mirror 8420, sandbox-controller 8430, verify 8440, gate-check 8450, notifier 8460,
# gate-relay 8470, audit 8480, fake GitHub 8353 api / 8354 git / 8355 gate-check's door / 8356 gate-relay's door). Only the bff and
# dev-oidc are published, on 127.0.0.1 (AISDLC_BFF_PORT moves the portal with its URL; AISDLC_OIDC_PORT the dev IdP inside and out, so two stacks
# can run on one host: the issuer and the redirect URI are the same name and port for the browser and the bff).
# The Push Broker's door on the fake GitHub is 8358.

x-factory: &factory
  # The one image, built by `migrate` below; every service picks its bundle with `command`.
  # M19: AISDLC_FACTORY_IMAGE names another tag of the same image (two stacks of different branches on one daemon)
  image: ${AISDLC_FACTORY_IMAGE:-aisdlc/factory:local}
  pull_policy: never
  user: '${AISDLC_UID:?run ./init-secrets first}:${AISDLC_GID:?run ./init-secrets first}'
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:mode=1777,size=64m
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: '3' }

# Networks. Docker has no packet filter between containers of one network, so a network is the unit
# of "can reach": two services that share one can call each other (and then only a token and its
# scopes stand between them). The networks below are cut so that the paths the specs forbid do not
# exist at all, and the ones that must exist are as narrow as the topology allows.
networks:
  # Every network has its own /24 under AISDLC_SUBNET_PREFIX (default 10.231): the stack has more networks than
  # Docker's default address pools hold (about 30), and the sandbox sessions' own networks still take theirs from
  # those pools. Two stacks at once need two prefixes (smoke.sh and e2e.sh set their own).
  # Browser edge: the only network with published ports (bff, dev-oidc). Not internal, because a
  # published port needs a route in; neither service needs one out.
  edge:
    ipam: { config: [{ subnet: '${AISDLC_SUBNET_PREFIX:-10.231}.1.0/24' }] }
  # The services that call each other: core, core-worker, identity, knowledge, codehost (and seed).
  app:
    ipam: { config: [{ subnet: '${AISDLC_SUBNET_PREFIX:-10.231}.2.0/24' }] }
    internal: true
  # Postgres reached by each database's own clients and nobody else. The Notary's and the Witness's
  # databases are on networks the record services never join (their roles also cannot connect to
  # each other's database, see db-init.sh).
  data-record:
    ipam: { config: [{ subnet: '${AISDLC_SUBNET_PREFIX:-10.231}.3.0/24' }] }
    internal: true
  data-notary:
    ipam: { config: [{ subnet: '${AISDLC_SUBNET_PREFIX:-10.231}.4.0/24' }] }
    internal: true
  data-witness:
    ipam: { config: [{ subnet: '${AISDLC_SUBNET_PREFIX:-10.231}.5.0/24' }] }
    internal: true
  # The kill switch's own database network (AR9): nothing but the kill switch and Postgres is on it.
  data-killswitch:
    ipam: { config: [{ subnet: '${AISDLC_SUBNET_PREFIX:-10.231}.6.0/24' }] }
    internal: true
  # kms-local reached by its callers. Three networks so that the Notary and the Witness, the two
  # independent signers (AR9, C33), have no route to each other or to the other callers through it.
  kms-notary:
    ipam: { config: [{ subnet: '${AISDLC_SUBNET_PREFIX:-10.231}.7.0/24' }] }
    internal: true
  kms-witness:
    ipam: { config: [{ subnet: '${AISDLC_SUBNET_PREFIX:-10.231}.8.0/24' }] }
    internal: true
  kms-clients:
    ipam: { config: [{ subnet: '${AISDLC_SUBNET_PREFIX:-10.231}.9.0/24' }] }
    internal: true
  # The kill switch's own signer link: it has its own key (`dev:killswitch`) and no other caller of
  # kms-local can see it from here.
  kms-killswitch:
    ipam: { config: [{ subnet: '${AISDLC_SUBNET_PREFIX:-10.231}.10.0/24' }] }
    internal: true
  # The Notary's API: its callers (core, core-worker, identity, seed). Knowledge, codehost, the bff
  # and the dev IdP are not on it. The Witness's API: its caller (core-worker, for the checkpointer).
  notary-api:
    ipam: { config: [{ subnet: '${AISDLC_SUBNET_PREFIX:-10.231}.11.0/24' }] }
    internal: true
  witness-api:
    ipam: { config: [{ subnet: '${AISDLC_SUBNET_PREFIX:-10.231}.12.0/24' }] }
    internal: true
  # The kill switch's API (AR9): its readers and pushers (core-worker) and the operator path. Core, the
  # Notary, the codehost, the bff and every other service are not on it, and the kill switch is on no
  # network of theirs: it has no route to core's write or command APIs, or to anything else. The one
  # core-side member is core-worker, whose HTTP surface is /healthz, /metrics and /admission (nothing
  # writes); the kill switch has no client that calls it.
  killswitch-api:
    ipam: { config: [{ subnet: '${AISDLC_SUBNET_PREFIX:-10.231}.13.0/24' }] }
    internal: true
  # The model gateway (RV §2 "Model key custody"): the one container that holds a vendor key. Three
  # networks and no more. `gateway-api` is its HTTP surface (the admin API for the work engine, the
  # Messages endpoint for sandboxes: later milestones attach their callers here and to no other
  # network of the gateway). `killswitch-gateway` is the one link it needs into the trust plane: the
  # kill switch's read API, asked before every call (nothing else of the kill switch's is reachable
  # from there, and the gateway is on no kms, notary or witness network). `gateway-egress` is its own
  # way out (the model vendor's API) and nobody else is on it.
  gateway-api:
    ipam: { config: [{ subnet: '${AISDLC_SUBNET_PREFIX:-10.231}.14.0/24' }] }
    internal: true
  # The gateway's own way to Postgres. It shares the record database (the aisdlc role) but NOT the
  # data-record network, so it has no route to identity, core, the bff or the rest of the record
  # services that sit there: only Postgres is on it besides the gateway.
  data-gateway:
    ipam: { config: [{ subnet: '${AISDLC_SUBNET_PREFIX:-10.231}.15.0/24' }] }
    internal: true
  killswitch-gateway:
    ipam: { config: [{ subnet: '${AISDLC_SUBNET_PREFIX:-10.231}.16.0/24' }] }
    internal: true
  # RC-UI-1: the portal's kill routes. The bff and the kill switch only: the bff forwards a person's kill or release
  # with that person's step-up proof (the kill switch verifies it and takes the actor from it, never from the bff's
  # token); nothing of core, the Notary or the record is on it, so the kill switch still has no route to them.
  killswitch-bff:
    ipam: { config: [{ subnet: '${AISDLC_SUBNET_PREFIX:-10.231}.55.0/24' }] }
    internal: true
  gateway-egress:
    ipam: { config: [{ subnet: '${AISDLC_SUBNET_PREFIX:-10.231}.17.0/24' }] }
  # The sandbox plane (profile `sandbox`, PLAN M13.2). None of these has a route out.
  #   - `sandbox-mirror`: the package mirror's own network. Each sandbox session gets a per-session internal
  #     network (created and removed by the sandbox driver through the coding proxy) and the mirror and the
  #     gateway are attached to it under fixed aliases: those two are the only peers a session ever has.
  #   - `docker-cvw` and `docker-coding`: the way each client reaches ITS Docker socket proxy and nothing else.
  sandbox-mirror:
    ipam: { config: [{ subnet: '${AISDLC_SUBNET_PREFIX:-10.231}.18.0/24' }] }
    internal: true
  docker-cvw:
    ipam: { config: [{ subnet: '${AISDLC_SUBNET_PREFIX:-10.231}.19.0/24' }] }
    internal: true
  docker-coding:
    ipam: { config: [{ subnet: '${AISDLC_SUBNET_PREFIX:-10.231}.20.0/24' }] }
    internal: true
  # The sandbox-controller (M14.2, ADR-0003 §6-7): `sandbox-controller-api` is how core-worker asks it for a session and
  # for the free slots H2 reads (and, 2026-11-12, the bff with a read-only token for the portal's Sandboxes screen); `data-sandbox-controller` is its own way to Postgres (its
  # least-privilege role reads the published caps and the admission grant, nothing else), shared with Postgres only.
  sandbox-controller-api:
    ipam: { config: [{ subnet: '${AISDLC_SUBNET_PREFIX:-10.231}.21.0/24' }] }
    internal: true
  data-sandbox-controller:
    ipam: { config: [{ subnet: '${AISDLC_SUBNET_PREFIX:-10.231}.22.0/24' }] }
    internal: true
  # M19: the sandbox-controller's one route to core, for the heartbeats of its running sessions
  # (`POST /v1/sessions/heartbeat`, token `tok-sandbox-controller-core`, scope `activity` and nothing else).
  core-activity:
    ipam: { config: [{ subnet: '${AISDLC_SUBNET_PREFIX:-10.231}.23.0/24' }] }
    internal: true
  # M19: the OpenTelemetry collector's inbound networks (profile `telemetry`). `telemetry` is shared by the services that
  # already share `app` (core, core-worker, identity, knowledge, codehost), so it opens no path between them that did
  # not exist; the bff has its own (`telemetry-bff`). The collector joins only these and has no way out.
  telemetry:
    ipam: { config: [{ subnet: '${AISDLC_SUBNET_PREFIX:-10.231}.24.0/24' }] }
    internal: true
  telemetry-bff:
    ipam: { config: [{ subnet: '${AISDLC_SUBNET_PREFIX:-10.231}.25.0/24' }] }
    internal: true
  # The verify service (M14.3, the plan's `cvw`): `verify-api` is how core-worker asks it for a step's check (nobody
  # else is on it); `data-verify` is its own way to Postgres (its role writes its own table and its own `verify:`
  # record streams, nothing else); `verify-codehost` is its one link to the codehost (the bundle route: the repo at the
  # base commit and the Unit head). Its kits reach the sandbox-controller on `sandbox-controller-api`, its reviewer the
  # gateway on `gateway-api` (under the run's own key).
  verify-api:
    ipam: { config: [{ subnet: '${AISDLC_SUBNET_PREFIX:-10.231}.26.0/24' }] }
    internal: true
  data-verify:
    ipam: { config: [{ subnet: '${AISDLC_SUBNET_PREFIX:-10.231}.27.0/24' }] }
    internal: true
  verify-codehost:
    ipam: { config: [{ subnet: '${AISDLC_SUBNET_PREFIX:-10.231}.28.0/24' }] }
    internal: true
  # The object store's API (M14.1). core-worker writes (M14.4: 7.6 stores the signed Evidence Packs in the
  # write-once bucket), core reads them for the portal (M14.6), gate-check reads them (M14.5); the store has no
  # other network and no route out.
  objectstore-api:
    ipam: { config: [{ subnet: '${AISDLC_SUBNET_PREFIX:-10.231}.29.0/24' }] }
    internal: true
  # gate-check (M14.5, ADR-0003 §1 Integration plane, profile `gate-check`): `data-gatecheck` is its own way to Postgres
  # (its role: its own tables and record streams, read-only the ledger, the bypass list's config view and four of
  # core's read models); `gatecheck-egress` is its own way out to GitHub (its App is not the codehost's, and the
  # codehost's egress is not shared); `gatecheck-github` is where the fake GitHub, which lives in the codehost's network
  # namespace, answers gate-check on its own port (8355; only the fake profile listens there). gate-check holds no
  # token of the codehost, so the codehost's API on the same network refuses it.
  data-gatecheck:
    ipam: { config: [{ subnet: '${AISDLC_SUBNET_PREFIX:-10.231}.30.0/24' }] }
    internal: true
  # M14.6: how the bff reads gate-check's verdicts for the portal (scope read); nobody else is on it.
  gatecheck-api:
    ipam: { config: [{ subnet: '${AISDLC_SUBNET_PREFIX:-10.231}.31.0/24' }] }
    internal: true
  gatecheck-github:
    ipam: { config: [{ subnet: '${AISDLC_SUBNET_PREFIX:-10.231}.32.0/24' }] }
    internal: true
  gatecheck-egress:
    ipam: { config: [{ subnet: '${AISDLC_SUBNET_PREFIX:-10.231}.33.0/24' }] }
  # gate-relay (M15.3, profile `gate-relay`): the same shape as gate-check's, its own: `data-gaterelay` to Postgres (its
  # role: its own tables and record streams, read-only the ledger, the release setting's config view, the packs' and
  # gate-check's merges' read models), `gaterelay-egress` to GitHub (its App is neither the codehost's nor
  # gate-check's), `gaterelay-github` where the fake GitHub answers it on its own port (8356).
  data-gaterelay:
    ipam: { config: [{ subnet: '${AISDLC_SUBNET_PREFIX:-10.231}.34.0/24' }] }
    internal: true
  gaterelay-github:
    ipam: { config: [{ subnet: '${AISDLC_SUBNET_PREFIX:-10.231}.35.0/24' }] }
    internal: true
  gaterelay-egress:
    ipam: { config: [{ subnet: '${AISDLC_SUBNET_PREFIX:-10.231}.36.0/24' }] }
  # The notifier (M18, ADR-0003 §1 Integration plane, profile `notifier`): `data-notifier` is its own way to Postgres
  # (its role: its own tables and `notifier:` record streams, read-only the gate, card and kill events it notifies
  # about, identity's read model and the channel rows' config view); `notifier-api` is the bff's way to it (its only
  # caller); `notifier-egress` is its own way out, to Slack's webhooks and the SMTP relay. It holds the channel
  # credentials, and nothing else holds them.
  data-notifier:
    ipam: { config: [{ subnet: '${AISDLC_SUBNET_PREFIX:-10.231}.37.0/24' }] }
    internal: true
  notifier-api:
    ipam: { config: [{ subnet: '${AISDLC_SUBNET_PREFIX:-10.231}.38.0/24' }] }
    internal: true
  notifier-egress:
    ipam: { config: [{ subnet: '${AISDLC_SUBNET_PREFIX:-10.231}.39.0/24' }] }
  # The audit service (M19, ADR-0003 §1 Trust plane, profile `audit`): `data-audit` is its own way to Postgres (its
  # role: its read models, its own `audit-` streams and four ledger entry types, read-only the record, the checkpoints,
  # identity's read model and the config view); `audit-api` is the bff's way to it (its only caller); `audit-core` is
  # its one link to core (the erasable payloads, scope `erasure`): nothing else of core's is reachable from there and
  # core holds no token of the audit service. No route out.
  data-audit:
    ipam: { config: [{ subnet: '${AISDLC_SUBNET_PREFIX:-10.231}.40.0/24' }] }
    internal: true
  audit-api:
    ipam: { config: [{ subnet: '${AISDLC_SUBNET_PREFIX:-10.231}.41.0/24' }] }
    internal: true
  audit-core:
    ipam: { config: [{ subnet: '${AISDLC_SUBNET_PREFIX:-10.231}.42.0/24' }] }
    internal: true
  # The Push Broker (M13.6; profile `push-broker`, and `full`): the codehost in CODEHOST_MODE=push with its OWN App (the one
  # writer of the factory: a commit on agent/<item>/<unit> and a Draft PR). `pushbroker` is how core-worker asks it for a
  # push and how it asks core (registered repos, scope `registry`; the Unit's lease and X2, scope `push_guard`) and identity
  # (scope `read`); all four already share `app`, so it opens no path between them. `pushbroker-github` is where the fake
  # GitHub (in the codehost's network namespace) answers it on its own port (8358); `pushbroker-egress` its own way out
  # to GitHub. It shares no other network with the read codehost and holds none of its tokens.
  pushbroker:
    ipam: { config: [{ subnet: '${AISDLC_SUBNET_PREFIX:-10.231}.58.0/24' }] }
    internal: true
  pushbroker-github:
    ipam: { config: [{ subnet: '${AISDLC_SUBNET_PREFIX:-10.231}.56.0/24' }] }
    internal: true
  pushbroker-egress:
    ipam: { config: [{ subnet: '${AISDLC_SUBNET_PREFIX:-10.231}.57.0/24' }] }
  # The codehost's only way out: api.github.com and github.com. Knowledge is not on it (nor on any
  # network with a route out), so it has no route to GitHub and gets repo content only as bundles
  # from the codehost.
  egress:
    ipam: { config: [{ subnet: '${AISDLC_SUBNET_PREFIX:-10.231}.43.0/24' }] }
  # M19: the collector's network of each service that shares no network with it yet (profile `telemetry`): one per
  # service, with that service and the collector on it and nobody else, so telemetry opens no path between services.
  telemetry-notary:
    ipam: { config: [{ subnet: '${AISDLC_SUBNET_PREFIX:-10.231}.44.0/24' }] }
    internal: true
  telemetry-witness:
    ipam: { config: [{ subnet: '${AISDLC_SUBNET_PREFIX:-10.231}.45.0/24' }] }
    internal: true
  telemetry-killswitch:
    ipam: { config: [{ subnet: '${AISDLC_SUBNET_PREFIX:-10.231}.46.0/24' }] }
    internal: true
  telemetry-kms-local:
    ipam: { config: [{ subnet: '${AISDLC_SUBNET_PREFIX:-10.231}.47.0/24' }] }
    internal: true
  telemetry-gateway:
    ipam: { config: [{ subnet: '${AISDLC_SUBNET_PREFIX:-10.231}.48.0/24' }] }
    internal: true
  telemetry-sandbox-controller:
    ipam: { config: [{ subnet: '${AISDLC_SUBNET_PREFIX:-10.231}.49.0/24' }] }
    internal: true
  telemetry-verify:
    ipam: { config: [{ subnet: '${AISDLC_SUBNET_PREFIX:-10.231}.50.0/24' }] }
    internal: true
  telemetry-gate-check:
    ipam: { config: [{ subnet: '${AISDLC_SUBNET_PREFIX:-10.231}.51.0/24' }] }
    internal: true
  telemetry-gate-relay:
    ipam: { config: [{ subnet: '${AISDLC_SUBNET_PREFIX:-10.231}.52.0/24' }] }
    internal: true
  telemetry-notifier:
    ipam: { config: [{ subnet: '${AISDLC_SUBNET_PREFIX:-10.231}.53.0/24' }] }
    internal: true
  telemetry-audit:
    ipam: { config: [{ subnet: '${AISDLC_SUBNET_PREFIX:-10.231}.54.0/24' }] }
    internal: true

volumes:
  pgdata: {}
  kms-state: {}
  codehost-work: {}
  # core-worker's S6 session store (workspaces, oracle locks, snapshots, packs; content-addressed): the one thing it
  # writes to disk, and only when the coding sessions are wired (CORE_WORKER_SANDBOX_CONTROLLER_URL)
  core-worker-sessions: {}
  knowledge-work: {}
  objectstore-data: {}

secrets:
  pg-superuser: { file: ./secrets/pg-superuser }
  pg-pass-aisdlc: { file: ./secrets/pg-pass-aisdlc }
  pg-pass-notary: { file: ./secrets/pg-pass-notary }
  pg-pass-witness: { file: ./secrets/pg-pass-witness }
