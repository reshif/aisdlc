# The AISDLC sign-in look (portal v2: the agreed sign-in page, option A) as a minimal Keycloak login theme.
# template.ftl draws the page (the brand panel and the card), login.ftl the sign-in form; every other page of the
# login flow (errors, OTP, update password, ...) is Keycloak's base page inside the same template.
parent=base
import=common/keycloak
styles=css/aisdlc.css
kcHtmlClass=
kcLoginClass=
kcFormGroupClass=field
kcLabelClass=
kcInputClass=input
kcInputErrorMessageClass=field-error
kcButtonClass=btn
kcButtonPrimaryClass=btn-local
kcButtonBlockClass=
kcButtonLargeClass=
kcAlertClass=alert
kcAlertTitleClass=alert-text
# the badge on the card; the enterprise theme empties it
envBadge=LOCAL · KEYCLOAK
# `local` (the test profile: the Test people panel) or `enterprise` (the child theme aisdlc-enterprise)
profile=local
